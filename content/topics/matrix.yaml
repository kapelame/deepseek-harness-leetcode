id: matrix
order: 8
title: {"zh": "矩阵：边界、坐标变换与有序结构", "en": "Matrices: bounds, coordinate maps, and sorted structure"}
summary: {"zh": "把矩阵问题拆成坐标变换、按层遍历和利用行列有序性三类，用边界变量和不变量避免越界与重复。", "en": "Split matrix problems into coordinate maps, layer-by-layer walks, and searches that exploit sorted rows and columns, using bound variables and invariants to avoid overruns and repeats."}
prerequisites: [two-pointers]
problems: [spiral-matrix, set-matrix-zeroes, rotate-image, search-a-2d-matrix-ii]
variants: [matrix-rotate-counterclockwise, matrix-count-not-greater]
lesson: {"motivation": {"zh": "一张照片存成 n×n 的像素矩阵，你要把它顺时针旋转 90 度，但内存紧张，不能复制一份。\n\n直接写 `new[j][n-1-i] = old[i][j]` 需要第二个矩阵。原地交换又容易把还没处理的格子覆盖掉。\n\n把旋转拆成两个简单的、天然原地的操作——沿对角线翻转和左右翻转——问题就变得机械而可靠。很多矩阵题都是这样：找到正确的坐标变换或遍历顺序，代码就只剩边界管理。", "en": "A photo is stored as an n×n pixel matrix and must be rotated 90 degrees clockwise, but memory is tight, so you cannot copy it.\n\nWriting `new[j][n-1-i] = old[i][j]` needs a second matrix, and swapping in place easily overwrites cells not processed yet.\n\nSplit the rotation into two simple operations that are naturally in place, a diagonal flip and a left-right flip, and the task becomes mechanical and reliable. Many matrix problems work this way: find the right coordinate map or traversal order and only bound bookkeeping remains."}, "strategy": {"zh": "**坐标变换**：顺时针旋转 = 转置 + 每行翻转；逆时针旋转 = 转置 + 每列翻转（或每行翻转 + 转置）。先在纸上验证 (i, j) 的去向。\n\n**按层遍历**：用 top、bottom、left、right 四个边界描述“还没访问的矩形”，每走完一条边就收缩对应边界；只剩一行或一列时要防止重复。\n\n**原地标记**：需要“先记录、后修改”时，可用第一行、第一列充当标记数组。\n\n**行列有序**：从右上角（或左下角）出发，每次比较都能排除一整行或一整列，O(m + n)。\n\n**不变量**：遍历时始终明确“哪些格子已处理、哪些未处理”。", "en": "**Coordinate maps**: clockwise rotation = transpose + reverse each row; counter-clockwise = transpose + reverse each column (or reverse each row, then transpose). Check where (i, j) goes on paper first.\n\n**Layer walks**: describe the unvisited rectangle with top, bottom, left, and right bounds and shrink one after each side; guard against repeats when one row or column remains.\n\n**In-place markers**: when you must record before modifying, the first row and column can serve as the marker arrays.\n\n**Sorted rows and columns**: start at the top-right (or bottom-left); each comparison discards a whole row or column, O(m + n).\n\n**Invariant**: always know which cells are processed and which are not."}, "example": {"title": {"zh": "例：螺旋遍历 [[1,2,3],[4,5,6],[7,8,9]]", "en": "Example: spiral walk of [[1,2,3],[4,5,6],[7,8,9]]"}, "body": {"zh": "四个边界围出尚未访问的矩形。", "en": "Four bounds enclose the unvisited rectangle."}, "traceColumns": ["side", "output", "bounds after"], "trace": [{"state": {"side": "top →", "output": "1 2 3", "bounds after": "top=1"}, "note": {"zh": "走完上边，上边界下移。", "en": "After the top side, the top bound moves down."}}, {"state": {"side": "right ↓", "output": "6 9", "bounds after": "right=1"}, "note": {"zh": "走完右边，右边界左移。", "en": "After the right side, the right bound moves left."}}, {"state": {"side": "bottom ←", "output": "8 7", "bounds after": "bottom=1"}, "note": {"zh": "还有多于一行，才走下边。", "en": "Walk the bottom only while more than one row remains."}}, {"state": {"side": "left ↑", "output": "4", "bounds after": "left=1"}, "note": {"zh": "左边只剩中间行。", "en": "Only the middle row remains on the left side."}}, {"state": {"side": "center", "output": "5", "bounds after": "done"}, "note": {"zh": "边界交错前输出最后一个格子。", "en": "The last cell is emitted before the bounds cross."}}]}, "check": [{"id": "rotation-map", "prompt": {"zh": "n×n 矩阵顺时针旋转 90 度后，原来的 (i, j) 去了哪里？", "en": "After a 90-degree clockwise rotation of an n×n matrix, where does (i, j) go?"}, "options": [{"zh": "(j, n-1-i)", "en": "(j, n-1-i)"}, {"zh": "(n-1-j, i)", "en": "(n-1-j, i)"}, {"zh": "(n-1-i, n-1-j)", "en": "(n-1-i, n-1-j)"}], "answer": 0, "explanation": {"zh": "第 i 行变成倒数第 i 列，第 j 列变成第 j 行。", "en": "Row i becomes column n-1-i and column j becomes row j."}}, {"id": "staircase", "prompt": {"zh": "在行列都递增的矩阵中，从右上角开始，若当前值大于 target，应该怎么移动？", "en": "In a matrix sorted along rows and columns, starting at the top-right, which way do you move when the value exceeds target?"}, "options": [{"zh": "向左，因为这一列剩下的值都更大", "en": "Left, because the rest of this column is larger"}, {"zh": "向下，因为下面的值更小", "en": "Down, because values below are smaller"}, {"zh": "向右", "en": "Right"}], "answer": 0, "explanation": {"zh": "当前列向下只会更大，所以整列都可以排除。", "en": "The column only grows downward, so the whole column is ruled out."}}], "practiceProblem": "spiral-matrix", "reflectionPrompt": {"zh": "螺旋遍历中，为什么只剩一行或一列时要跳过“下边”和“左边”？举一个会出错的例子。", "en": "In the spiral walk, why skip the bottom and left sides when only one row or column remains? Give an input that would go wrong otherwise."}}
