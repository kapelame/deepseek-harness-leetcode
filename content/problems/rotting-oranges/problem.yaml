summary: {"zh": "网格中 0 为空、1 为新鲜橘子、2 为腐烂橘子。每分钟，腐烂橘子会让上下左右相邻的新鲜橘子腐烂。返回所有橘子都腐烂所需的最少分钟数；不可能则返回 -1。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "In a grid, 0 is empty, 1 a fresh orange, and 2 a rotten one. Each minute, rotten oranges rot their fresh neighbors up, down, left, and right. Return the minutes until no fresh orange remains, or -1 if that never happens. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ m, n ≤ 10，grid[i][j] ∈ {0, 1, 2}", "en": "1 ≤ m, n ≤ 10, grid[i][j] ∈ {0, 1, 2}"}]
