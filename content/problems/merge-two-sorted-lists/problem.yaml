summary: {"zh": "把两个升序链表合并成一个升序链表，返回合并后的头节点。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Merge two sorted linked lists into one sorted list and return its head. (Original summary written for Learn; see LeetCode for the official statement.)"}
