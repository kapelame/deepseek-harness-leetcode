summary: {"zh": "在非递减数组中找出 target 第一次和最后一次出现的下标；不存在则返回 [-1, -1]。要求 O(log n)。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "In a non-decreasing array, return the first and last index of target, or [-1, -1] if absent, in O(log n). (Original summary written for Learn; see LeetCode for the official statement.)"}
