hints: [{"zh": "总和为奇数时直接不可能。否则问题变成：能否选出一些数，和为总和的一半？", "en": "An odd total is impossible. Otherwise: can some numbers sum to half the total?"}, {"zh": "这是 0-1 背包：每个数最多用一次，dp[t] 表示能否凑出和 t。", "en": "That is a 0-1 knapsack: each number is used at most once, and dp[t] says whether t is reachable."}, {"zh": "对每个数，t 从大到小更新 dp[t] |= dp[t - num]，倒序保证每个数只用一次。", "en": "For each number update dp[t] |= dp[t - num] with t decreasing, so each number is used once."}]
solution: {"explanation": {"zh": "0-1 背包可行性 DP，倒序更新一维数组。时间 O(n × sum)，空间 O(sum)。", "en": "A 0-1 knapsack feasibility DP updating one array backwards. O(n × sum) time, O(sum) space."}}
