summary: {"zh": "返回出现频率最高的 k 个元素，顺序不限。保证答案唯一（第 k 名与第 k+1 名频率不同）。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Return the k most frequent elements in any order. The answer is guaranteed unique, so ranks k and k+1 differ in frequency. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ n ≤ 10⁵，-10⁴ ≤ nums[i] ≤ 10⁴，k 不超过不同元素个数", "en": "1 ≤ n ≤ 10⁵, -10⁴ ≤ nums[i] ≤ 10⁴, k is at most the number of distinct values"}]
params: [{"name": "nums", "type": "int[]"}, {"name": "k", "type": "int"}]
returns: "int[]"
comparator: {"kind": "unordered"}
entry: {"python": "topKFrequent", "typescript": "topKFrequent"}
perCaseMs: 1000
inputs: [{"type": "int[]", "minLength": 1, "smallMaxLength": 10, "largeLength": 20000, "min": -10000, "max": 10000, "smallMin": 0, "smallMax": 4}, {"type": "int", "min": 1, "max": 1}]
hints: [{"zh": "先用哈希表统计每个数出现的次数。", "en": "Count each value's occurrences with a hash map first."}, {"zh": "在 (频率, 值) 上维护大小为 k 的最小堆，得到频率前 k 的值。", "en": "Keep a size-k min-heap over (frequency, value) to retain the top k."}, {"zh": "线性做法：桶排序，bucket[f] 存放出现 f 次的值，从高频桶向低频收集。", "en": "Linear alternative: bucket[f] holds values occurring f times; collect from the highest bucket down."}]
solution: {"explanation": {"zh": "计数 + 大小为 k 的堆，时间 O(n log k)；桶排序可做到 O(n)。", "en": "Counting plus a size-k heap runs in O(n log k); bucket sort reaches O(n)."}}
