examples: [{"args": [["MRUCache", "put", "put", "get", "put", "get", "get"], [[2], [1, 1], [2, 2], [1], [3, 3], [1], [2]]], "expected": [null, null, null, 1, null, -1, 2]}, {"args": [["MRUCache", "put", "put", "put", "get", "get"], [[2], [1, 1], [2, 2], [3, 3], [1], [2]]], "expected": [null, null, null, null, 1, -1]}]
boundaryCases: [{"args": [["MRUCache", "put", "put", "get"], [[1], [1, 1], [2, 2], [1]]]}, {"args": [["MRUCache", "get"], [[1], [5]]]}, {"args": [["MRUCache", "put", "put", "put", "get"], [[1], [1, 1], [1, 2], [2, 3], [1]]]}]
hints: [{"zh": "与 LRU 相比，按使用顺序排列的结构还需要吗？", "en": "Compared with LRU, do you still need the usage-ordered structure?"}, {"zh": "需要：最近使用的键位于顺序的一端，淘汰就从这一端进行。", "en": "Yes: the most recently used key sits at one end of the order, and eviction happens at that end."}, {"zh": "插入新键前若已满，先弹出“最近”一端的键，再插入新键并标记为最近使用；Python 中可用 OrderedDict 的 popitem(last=True)。", "en": "When full, pop the key at the recent end before inserting the newcomer and marking it recent; in Python, OrderedDict.popitem(last=True) does it."}]
