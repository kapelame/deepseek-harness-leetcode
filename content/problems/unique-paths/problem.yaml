summary: {"zh": "机器人在 m×n 网格左上角，每次只能向右或向下走一步，求到达右下角的不同路径数。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "A robot at the top-left of an m×n grid moves only right or down; count the distinct paths to the bottom-right. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ m, n ≤ 100，答案 ≤ 2×10⁹", "en": "1 ≤ m, n ≤ 100, answer ≤ 2×10⁹"}]
