id: graph
order: 10
title: {"zh": "图：网格搜索、多源 BFS 与拓扑排序", "en": "Graphs: grid search, multi-source BFS, and topological order"}
summary: {"zh": "把网格和依赖关系看成图：用 DFS/BFS 找连通块，用多源 BFS 求同时扩散的时间，用拓扑排序检测环和安排顺序。", "en": "See grids and dependencies as graphs: DFS/BFS finds connected components, multi-source BFS measures simultaneous spreading, and topological sorting detects cycles and orders tasks."}
prerequisites: [trees]
problems: [number-of-islands, rotting-oranges, course-schedule]
variants: [graph-max-island-area, graph-minimum-semesters]
lesson: {"motivation": {"zh": "一张卫星图被切成网格，每格是陆地或水。救援队想知道这片海域有几座岛。\n\n逐格查看很容易，难的是判断两块陆地是不是同一座岛——它们可能通过一条蜿蜒的陆路相连。\n\n把每个格子看成节点、相邻的陆地之间连一条边，“岛屿”就是图的连通块。同样的视角适用于传染扩散（多源 BFS）和课程依赖（有向图的拓扑排序）。", "en": "A satellite image is cut into a grid of land and water cells, and a rescue team wants to know how many islands there are.\n\nChecking each cell is easy; deciding whether two land cells belong to the same island is not, since they may connect through a winding strip of land.\n\nTreat each cell as a node with edges between adjacent land cells, and an island becomes a connected component. The same lens covers spreading processes (multi-source BFS) and course dependencies (topological order in a directed graph)."}, "strategy": {"zh": "**连通块计数**：遍历所有格子，遇到未访问的陆地就计数，并用 DFS/BFS 把整块标记为已访问。大网格用显式栈或队列，避免递归过深。\n\n**多源 BFS**：所有起点一起入队，按层扩散，层数就是时间或距离。\n\n**拓扑排序（Kahn）**：统计入度，入度为 0 的节点入队；出队时删除其出边。能处理完所有节点 ⇔ 图中无环。\n\n**复杂度**：网格 O(mn)，一般图 O(V + E)，每个节点和边处理常数次。", "en": "**Counting components**: visit every cell; each unvisited land cell starts a new component that DFS/BFS marks entirely. Use an explicit stack or queue on large grids to avoid deep recursion.\n\n**Multi-source BFS**: enqueue every source at once and expand level by level; the level is the time or distance.\n\n**Topological sort (Kahn)**: count in-degrees, enqueue nodes with in-degree 0, and remove their outgoing edges when dequeued. Processing every node ⇔ the graph has no cycle.\n\n**Complexity**: O(mn) on grids and O(V + E) on general graphs; each node and edge is handled a constant number of times."}, "example": {"title": {"zh": "例：课程 0→1→2，外加先修关系 [1, 0]、[2, 1]", "en": "Example: prerequisites [1, 0] and [2, 1]"}, "body": {"zh": "[a, b] 表示先学 b 再学 a，即边 b → a。", "en": "[a, b] means b before a, an edge b → a."}, "traceColumns": ["queue", "taken", "in-degrees"], "trace": [{"state": {"queue": "[0]", "taken": "", "in-degrees": "0:0 1:1 2:1"}, "note": {"zh": "只有课程 0 没有先修课。", "en": "Only course 0 has no prerequisite."}}, {"state": {"queue": "[1]", "taken": "0", "in-degrees": "1:0 2:1"}, "note": {"zh": "学完 0，课程 1 的入度降为 0。", "en": "After 0, course 1 drops to in-degree 0."}}, {"state": {"queue": "[2]", "taken": "0 1", "in-degrees": "2:0"}, "note": {"zh": "学完 1，课程 2 可以开始。", "en": "After 1, course 2 becomes available."}}, {"state": {"queue": "[]", "taken": "0 1 2", "in-degrees": "—"}, "note": {"zh": "三门课全部取出：无环，可以学完。", "en": "All three courses were taken: no cycle, so all can be finished."}}]}, "check": [{"id": "cycle", "prompt": {"zh": "Kahn 算法结束时，取出的节点数少于总数，说明什么？", "en": "When Kahn's algorithm ends having taken fewer nodes than exist, what does that mean?"}, "options": [{"zh": "图中存在环，剩下的节点入度永远不会降到 0", "en": "There is a cycle; the remaining nodes never reach in-degree 0"}, {"zh": "图不连通", "en": "The graph is disconnected"}, {"zh": "队列实现有误", "en": "The queue is implemented wrongly"}], "answer": 0, "explanation": {"zh": "环上的每个节点都依赖环上的另一个节点，所以它们的入度永远不为 0。", "en": "Every node on a cycle depends on another node of the cycle, so none reaches in-degree 0."}}, {"id": "multi-source", "prompt": {"zh": "腐烂橘子问题中，为什么要把所有腐烂橘子一起放进队列，而不是逐个做 BFS？", "en": "In the rotting-oranges problem, why enqueue all rotten oranges together instead of running a BFS from each?"}, "options": [{"zh": "它们同时扩散，同一层代表同一分钟", "en": "They spread at the same time, so one level is one minute"}, {"zh": "为了节省内存", "en": "To save memory"}, {"zh": "因为 BFS 只能有一个起点", "en": "Because BFS supports only one source"}], "answer": 0, "explanation": {"zh": "多源 BFS 的第 k 层恰好是第 k 分钟被感染的橘子。", "en": "Level k of the multi-source BFS is exactly the oranges infected at minute k."}}], "practiceProblem": "number-of-islands", "reflectionPrompt": {"zh": "解释为什么数岛屿时每个格子最多被访问常数次，以及为什么大网格上递归 DFS 可能出问题。", "en": "Explain why each cell is visited a constant number of times when counting islands, and why recursive DFS can fail on large grids."}}
