hints: [{"zh": "一个片段包含字母 c，就必须延伸到 c 最后一次出现的位置。", "en": "A part containing letter c must extend to c's last occurrence."}, {"zh": "先记录每个字母最后出现的下标。", "en": "Record each letter's last index first."}, {"zh": "扫描时维护当前片段必须到达的最远位置 end；当 i == end 时可以切一刀。", "en": "While scanning keep end, how far the current part must reach; cut when i == end."}]
solution: {"explanation": {"zh": "贪心：片段在“已见字母的最后出现位置的最大值”处结束。时间 O(n)，空间 O(1)。", "en": "Greedy: a part ends at the maximum last occurrence of the letters seen so far. O(n) time, O(1) space."}}
