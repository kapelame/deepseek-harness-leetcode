summary: {"zh": "求二叉树的直径：任意两个节点之间最长路径上的边数（路径不一定经过根）。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Return the tree's diameter: the number of edges on the longest path between any two nodes, which need not pass through the root. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ 节点数 ≤ 10⁴，-100 ≤ Node.val ≤ 100", "en": "1 ≤ nodes ≤ 10⁴, -100 ≤ Node.val ≤ 100"}]
