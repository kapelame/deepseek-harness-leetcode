hints: [{"zh": "展开后的顺序就是先序遍历顺序。", "en": "The flattened order is the preorder sequence."}, {"zh": "对节点 x：把左子树接到 x.right，原来的右子树接到左子树最右节点的后面。", "en": "For node x: move the left subtree to x.right and attach the old right subtree after the left subtree's rightmost node."}, {"zh": "从根开始沿 right 逐个处理，每处理一个节点把它的 left 设为 null，即可 O(1) 额外空间。", "en": "Walk from the root along right, processing each node and clearing its left, for O(1) extra space."}]
solution: {"explanation": {"zh": "类 Morris 方法：把左子树整体插到右边，前驱（左子树最右节点）连接原右子树。每条边处理常数次，时间 O(n)，额外空间 O(1)。", "en": "A Morris-like splice: move the left subtree to the right and link its rightmost node to the old right subtree. Each edge is handled a constant number of times, O(n) time, O(1) extra space."}}
