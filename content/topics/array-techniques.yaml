id: array-techniques
order: 7
title: {"zh": "数组技巧：前缀和与原地操作", "en": "Array techniques: prefix sums and in-place work"}
summary: {"zh": "把“区间和”变成两个前缀和之差，把数组本身当作哈希表或缓冲区，在 O(n) 时间、O(1) 额外空间内解决数组问题。", "en": "Turn range sums into a difference of two prefix sums, and use the array itself as a hash table or buffer to solve array problems in O(n) time and O(1) extra space."}
prerequisites: [hashing]
problems: [subarray-sum-equals-k, maximum-subarray, merge-intervals, rotate-array, product-of-array-except-self, first-missing-positive]
variants: [array-subarrays-divisible-by-k, array-max-circular-subarray]
lesson: {"motivation": {"zh": "一家商店记录了每天的盈亏 `[3, -1, 2, -4, 5]`。老板问：“有多少段连续的日子，盈亏总和恰好是 1？”\n\n逐段求和需要枚举所有起点和终点，n 天就是 O(n²) 段，每段再求和更慢。\n\n关键观察：任意一段的和，都等于“到结尾为止的累计和”减去“到开头之前的累计和”。只要记录每个累计和出现过几次，就能在一次扫描中回答问题。", "en": "A shop logs daily profit and loss `[3, -1, 2, -4, 5]`. The owner asks: \"How many runs of consecutive days add up to exactly 1?\"\n\nSumming every run means enumerating all starts and ends, O(n²) runs for n days, and summing each run is slower still.\n\nThe key observation: the sum of any run equals the running total at its end minus the running total just before its start. Count how often each running total has appeared and a single scan answers the question."}, "strategy": {"zh": "**前缀和**：`prefix[i]` 表示前 i 个元素之和，区间 `[l, r]` 的和 = `prefix[r+1] - prefix[l]`。\n\n**前缀和 + 哈希计数**：扫描时维护当前前缀和 s 与一个计数表；以当前位置结尾、和为 k 的子数组个数 = 之前出现过的 `s - k` 的次数。计数表初始包含 `{0: 1}`（空前缀）。\n\n**前缀积/后缀积**：把“除自身以外”拆成左侧部分 × 右侧部分，两遍扫描完成。\n\n**原地技巧**：用读写双指针压缩数组；用翻转实现轮转；把值 v 交换到下标 v-1，让数组充当哈希表。\n\n**复杂度**：都是 O(n) 时间；前缀和计数需要 O(n) 空间，原地技巧只需 O(1)。", "en": "**Prefix sums**: `prefix[i]` is the sum of the first i elements, so the sum of `[l, r]` is `prefix[r+1] - prefix[l]`.\n\n**Prefix sums + hash counts**: while scanning keep the running sum s and a count table; the subarrays ending here with sum k number exactly the earlier occurrences of `s - k`. Seed the table with `{0: 1}` for the empty prefix.\n\n**Prefix/suffix products**: split \"everything except me\" into a left part times a right part and finish in two passes.\n\n**In-place tricks**: compact with read/write pointers, rotate with reversals, and swap value v to index v-1 so the array acts as a hash table.\n\n**Complexity**: all run in O(n) time; prefix counting needs O(n) space, the in-place tricks O(1)."}, "example": {"title": {"zh": "例：nums = [3, -1, 2, -4, 5]，k = 1", "en": "Example: nums = [3, -1, 2, -4, 5], k = 1"}, "body": {"zh": "计数表记录每个前缀和出现的次数；每一步把 count[s - k] 加到答案上。", "en": "The table counts each prefix sum; every step adds count[s - k] to the answer."}, "traceColumns": ["x", "s", "s-k", "count before", "answer"], "trace": [{"state": {"x": "3", "s": "3", "s-k": "2", "count before": "{0:1}", "answer": "0"}, "note": {"zh": "2 没出现过，没有以这里结尾的答案。", "en": "2 has not appeared; nothing ends here."}}, {"state": {"x": "-1", "s": "2", "s-k": "1", "count before": "{0:1, 3:1}", "answer": "0"}, "note": {"zh": "1 没出现过。", "en": "1 has not appeared."}}, {"state": {"x": "2", "s": "4", "s-k": "3", "count before": "{0:1, 3:1, 2:1}", "answer": "1"}, "note": {"zh": "3 出现过一次：子数组 [-1, 2] 的和为 1。", "en": "3 appeared once: the subarray [-1, 2] sums to 1."}}, {"state": {"x": "-4", "s": "0", "s-k": "-1", "count before": "{0:1, 3:1, 2:1, 4:1}", "answer": "1"}, "note": {"zh": "-1 没出现过。", "en": "-1 has not appeared."}}, {"state": {"x": "5", "s": "5", "s-k": "4", "count before": "{0:2, 3:1, 2:1, 4:1}", "answer": "2"}, "note": {"zh": "4 出现过一次：子数组 [-4, 5] 的和为 1。", "en": "4 appeared once: the subarray [-4, 5] sums to 1."}}]}, "check": [{"id": "empty-prefix", "prompt": {"zh": "为什么计数表要以 {0: 1} 开始？", "en": "Why does the count table start as {0: 1}?"}, "options": [{"zh": "为了让和为 k、从下标 0 开始的子数组也能被计数", "en": "So subarrays that start at index 0 and sum to k are counted too"}, {"zh": "为了避免除以零", "en": "To avoid dividing by zero"}, {"zh": "因为数组至少有一个元素", "en": "Because the array has at least one element"}], "answer": 0, "explanation": {"zh": "从下标 0 开始的子数组对应“空前缀”，其前缀和为 0。", "en": "A subarray starting at index 0 pairs with the empty prefix, whose sum is 0."}}, {"id": "negatives", "prompt": {"zh": "数组含负数时，为什么双指针滑动窗口不能统计和为 k 的子数组？", "en": "With negative numbers, why can a sliding window not count subarrays summing to k?"}, "options": [{"zh": "窗口扩大时和不一定变大，无法单调地决定移动哪一端", "en": "Growing the window does not always increase the sum, so there is no monotone rule for which end to move"}, {"zh": "负数会让前缀和溢出", "en": "Negative numbers overflow the prefix sums"}, {"zh": "滑动窗口只能处理字符串", "en": "Sliding windows only work on strings"}], "answer": 0, "explanation": {"zh": "滑动窗口依赖“扩大必增、缩小必减”的单调性，负数打破了它；前缀和计数不依赖单调性。", "en": "A sliding window relies on growing raising the sum and shrinking lowering it; negatives break that, while prefix counting needs no monotonicity."}}], "practiceProblem": "subarray-sum-equals-k", "reflectionPrompt": {"zh": "用自己的话解释：为什么“之前出现过多少次 s - k”恰好等于“以当前位置结尾、和为 k 的子数组个数”？", "en": "In your own words: why does the number of earlier occurrences of s - k equal the number of subarrays ending here that sum to k?"}}
