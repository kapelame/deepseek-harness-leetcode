hints: [{"zh": "dp[i][j] = text1 前 i 个字符与 text2 前 j 个字符的 LCS 长度。", "en": "dp[i][j] = LCS length of the first i characters of text1 and the first j of text2."}, {"zh": "末尾字符相同：dp[i][j] = dp[i-1][j-1] + 1；否则取 max(dp[i-1][j], dp[i][j-1])。", "en": "Equal last characters: dp[i][j] = dp[i-1][j-1] + 1; otherwise max(dp[i-1][j], dp[i][j-1])."}, {"zh": "dp[0][*] = dp[*][0] = 0；可以用一维数组加一个变量保存左上角的值。", "en": "dp[0][*] = dp[*][0] = 0; one row plus a variable for the upper-left value suffices."}]
solution: {"explanation": {"zh": "双序列 DP，时间 O(mn)，空间可降到 O(min(m, n))。", "en": "Two-sequence DP in O(mn) time; space reduces to O(min(m, n))."}}
examples: [{"id": "ex-1", "args": ["abcde", "ace"], "expected": 3}, {"id": "ex-2", "args": ["abc", "abc"], "expected": 3}, {"id": "ex-3", "args": ["abc", "def"], "expected": 0}]
