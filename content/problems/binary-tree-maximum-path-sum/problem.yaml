hints: [{"zh": "和“直径”类似：最优路径在某个节点拐弯。这时它由哪几部分组成？", "en": "Like the diameter: the best path turns at some node. What parts make it up there?"}, {"zh": "节点值 + 左边向下延伸的最大收益 + 右边向下延伸的最大收益；收益为负时就不要它（取 0）。", "en": "Node value + best downward gain on the left + best downward gain on the right, dropping a negative gain (use 0)."}, {"zh": "递归函数返回“从该节点向下的单边最大路径和”，同时用全局变量更新拐弯路径的最大值。", "en": "The recursion returns the best one-sided downward sum from the node while a global tracks the best turning path."}]
solution: {"explanation": {"zh": "后序遍历：返回单边最大贡献 max(0, …)，在每个节点用 值 + 左贡献 + 右贡献 更新答案。时间 O(n)，空间 O(h)。", "en": "Post-order: return the best one-sided contribution clipped at 0 and update the answer with value + left + right at each node. O(n) time, O(h) space."}}
examples: [{"id": "ex-1", "args": [[1, 2, 3]], "expected": 6}, {"id": "ex-2", "args": [[-10, 9, 20, null, null, 15, 7]], "expected": 42}]
