summary: {"zh": "设计一个栈，除了 push、pop、top 外，还能在 O(1) 时间内返回当前栈中的最小元素 getMin。pop、top、getMin 只会在栈非空时调用。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Design a stack that supports push, pop, and top, and returns the current minimum with getMin in O(1) time. pop, top, and getMin are only called on a non-empty stack. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "-2³¹ ≤ val ≤ 2³¹-1，调用总次数 ≤ 3×10⁴", "en": "-2³¹ ≤ val ≤ 2³¹-1, at most 3×10⁴ calls"}]
