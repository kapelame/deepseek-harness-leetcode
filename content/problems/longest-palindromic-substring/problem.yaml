summary: {"zh": "返回 s 中最长的回文子串。长度相同的最长回文子串有多个时，返回任意一个都算正确。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Return the longest palindromic substring of s; when several have the maximum length, any of them is accepted. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ |s| ≤ 1000，由数字和英文字母组成", "en": "1 ≤ |s| ≤ 1000, digits and English letters"}]
params: [{"name": "s", "type": "string"}]
returns: "string"
comparator: {"kind": "validator", "name": "longest-palindromic-substring"}
entry: {"python": "longestPalindrome", "typescript": "longestPalindrome"}
perCaseMs: 3000
inputs: [{"type": "string", "minLength": 1, "maxLength": 1000, "smallMaxLength": 9, "largeLength": 1000, "alphabet": "ab", "smallAlphabet": "abc"}]
hints: [{"zh": "回文串关于中心对称。一个长度为 n 的字符串有多少个可能的中心？", "en": "A palindrome mirrors around its center. How many possible centers does a string of length n have?"}, {"zh": "2n - 1 个：每个字符本身，以及每两个相邻字符之间。", "en": "2n - 1: every character, and every gap between adjacent characters."}, {"zh": "从每个中心向两侧扩展，直到两端字符不同，记录最长的一段。也可以用 dp[i][j] 表示 s[i..j] 是否回文。", "en": "Expand from each center until the ends differ and keep the longest; or let dp[i][j] say whether s[i..j] is a palindrome."}]
solution: {"explanation": {"zh": "中心扩展法，时间 O(n²)，空间 O(1)；区间 DP 同为 O(n²) 但需要 O(n²) 空间。", "en": "Center expansion in O(n²) time and O(1) space; interval DP is also O(n²) but needs O(n²) space."}}
examples: [{"id": "ex-1", "args": ["babad"], "expected": "bab"}, {"id": "ex-2", "args": ["cbbd"], "expected": "bb"}]
boundaryCases: [{"args": ["a"]}, {"args": ["ab"]}, {"args": ["aa"]}, {"args": ["aba"]}, {"args": ["abba"]}, {"args": ["cbbd"]}]
