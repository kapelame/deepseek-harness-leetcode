summary: {"zh": "路径是沿父子边连接的节点序列，每个节点至多出现一次，至少包含一个节点，不必经过根。返回所有路径中节点值之和的最大值。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "A path is a sequence of nodes joined by parent-child edges, each node used at most once, with at least one node and not necessarily through the root. Return the largest sum of node values over all paths. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ 节点数 ≤ 3×10⁴，-1000 ≤ Node.val ≤ 1000", "en": "1 ≤ nodes ≤ 3×10⁴, -1000 ≤ Node.val ≤ 1000"}]
