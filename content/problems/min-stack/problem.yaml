hints: [{"zh": "只用一个变量记录最小值，pop 掉最小值之后怎么办？", "en": "With one variable for the minimum, what happens after popping the minimum?"}, {"zh": "让每个栈元素同时记住“压入它时栈中的最小值”。", "en": "Let every stack entry remember the minimum at the time it was pushed."}, {"zh": "压入 (val, min(val, 当前最小值))；getMin 就是栈顶记录的最小值，pop 后自然恢复。", "en": "Push (val, min(val, current minimum)); getMin reads the top's recorded minimum and recovers automatically after pop."}]
solution: {"explanation": {"zh": "辅助信息与元素一同入栈：每个位置保存到该位置为止的最小值，所有操作 O(1)。空间 O(n)。", "en": "Store auxiliary data with each entry: every position keeps the minimum up to itself, so all operations are O(1). O(n) space."}}
