hints: [{"zh": "找到一个 target 后向两边扩展，最坏会退化成 O(n)。", "en": "Finding one target and expanding outward degrades to O(n) in the worst case."}, {"zh": "做两次二分：一次找“第一个 ≥ target”的位置，一次找“第一个 > target”的位置。", "en": "Run two binary searches: the first position ≥ target and the first position > target."}, {"zh": "左边界 = lower_bound(target)，右边界 = lower_bound(target + 1) - 1；左边界越界或值不等时返回 [-1, -1]。", "en": "Left = lower_bound(target), right = lower_bound(target + 1) - 1; if left is out of range or holds another value, return [-1, -1]."}]
solution: {"explanation": {"zh": "两次下界二分确定区间两端。时间 O(log n)，空间 O(1)。", "en": "Two lower-bound searches find both ends. O(log n) time, O(1) space."}}
