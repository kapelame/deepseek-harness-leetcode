hints: [{"zh": "“除自己以外的乘积”可以拆成左边部分和右边部分的乘积吗？", "en": "Can 'product of everything else' split into a left part and a right part?"}, {"zh": "answer[i] = 前缀积(0..i-1) × 后缀积(i+1..n-1)。", "en": "answer[i] = prefix product (0..i-1) × suffix product (i+1..n-1)."}, {"zh": "第一遍从左写入前缀积，第二遍从右乘上后缀积，只用一个变量保存后缀积。", "en": "First pass writes prefix products left to right; second pass multiplies suffix products right to left using a single variable."}]
solution: {"explanation": {"zh": "两遍扫描：先在答案数组中存前缀积，再从右向左乘以累积的后缀积。时间 O(n)，除输出外 O(1) 空间。", "en": "Two passes: store prefix products in the answer, then multiply by a running suffix product from the right. O(n) time, O(1) extra space besides the output."}}
