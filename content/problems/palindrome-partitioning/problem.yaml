summary: {"zh": "把字符串分割成若干子串，使每个子串都是回文串，返回所有可能的分割方案，方案之间顺序不限。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Split the string into substrings that are all palindromes and return every such split, in any order. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ |s| ≤ 16，只含小写字母", "en": "1 ≤ |s| ≤ 16, lowercase letters"}]
