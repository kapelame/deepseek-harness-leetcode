hints: [{"zh": "从哪个角出发，比较一次就能排除一整行或一整列？", "en": "From which corner does one comparison eliminate a whole row or column?"}, {"zh": "从右上角开始：当前值比 target 大就左移（这一列都更大），比 target 小就下移。", "en": "Start at the top-right: if the value is larger than target move left (the column is larger), if smaller move down."}, {"zh": "每一步排除一行或一列，最多走 m + n 步。", "en": "Each step eliminates a row or a column, so at most m + n steps."}]
solution: {"explanation": {"zh": "从右上角出发的阶梯搜索：比较结果决定排除当前列还是当前行。时间 O(m + n)，空间 O(1)。", "en": "Staircase search from the top-right corner: each comparison discards the current column or row. O(m + n) time, O(1) space."}}
