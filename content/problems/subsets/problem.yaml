inputs: [{"type": "int[]", "minLength": 1, "maxLength": 10, "smallMaxLength": 5, "largeLength": 10, "min": -10, "max": 10, "distinct": true}]
hints: [{"zh": "每个元素只有两种状态：选或不选。", "en": "Each element is either in or out."}, {"zh": "递归到第 i 个元素时，分别走“选它”和“不选它”两条分支。", "en": "At element i, recurse once with it and once without it."}, {"zh": "或者按起点枚举：dfs(start) 每进入一次就记录当前路径，再从 start 往后依次尝试加入元素。", "en": "Or enumerate by start: dfs(start) records the current path on entry, then tries adding each later element."}]
solution: {"explanation": {"zh": "回溯枚举每个元素的选/不选，共 2ⁿ 个子集，时间 O(n·2ⁿ)。", "en": "Backtracking over in/out for each element yields 2ⁿ subsets in O(n·2ⁿ) time."}}
