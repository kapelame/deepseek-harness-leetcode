id: greedy
order: 14
title: {"zh": "贪心：每一步做局部最优，并证明它不会错过全局最优", "en": "Greedy: take the locally best step and prove it never loses the global best"}
summary: {"zh": "贪心算法每一步只看当前最好的选择，不回头。关键不是写代码，而是论证：为什么这样选不会错过更好的答案（交换论证或不变量）。", "en": "A greedy algorithm takes the best-looking step each time and never looks back. The hard part is not the code but the argument that this choice never misses a better answer, by an exchange argument or an invariant."}
prerequisites: [array-techniques]
problems: [best-time-to-buy-and-sell-stock, jump-game, jump-game-ii, partition-labels]
variants: [greedy-stock-unlimited, greedy-farthest-reach]
lesson: {"motivation": {"zh": "你在规划一次只买一次、卖一次的股票交易，手里有过去一个月的价格。\n\n枚举所有“买入日、卖出日”组合是 O(n²)。换个角度：如果我决定在今天卖出，最好的买入日一定是今天之前价格最低的那天——这个结论不需要回头修改，所以只要边走边记住“目前最低价”。\n\n这就是贪心：每一步做一个当前看来最好的、并且可以证明不会出错的决定。", "en": "You plan a single buy and a single sell and have a month of past prices.\n\nTrying every buy-day and sell-day pair is O(n²). Look at it differently: if you sell today, the best buy day is the cheapest day before today. That conclusion never needs revisiting, so you only remember the lowest price so far as you walk.\n\nThat is greed: at each step make the decision that looks best now and that you can prove is never wrong."}, "strategy": {"zh": "**常见模式**：\n- 维护“到目前为止最好的东西”（最低价、最远可达位置），一次扫描。\n- 按层推进的贪心（跳跃游戏 II）：本层能到达的范围决定下一层。\n- 区间类：先确定每个元素的“最后出现位置”或按端点排序，再线性扫描。\n\n**如何证明**：\n- **交换论证**：假设最优解在某一步与贪心选择不同，把它换成贪心选择后不会变差。\n- **不变量**：说明扫描到 i 时维护的量（如最远可达位置）始终正确。\n\n**警惕**：很多看似可以贪心的问题其实需要动态规划（例如有冷冻期的股票）。写之前先找反例。", "en": "**Common patterns**:\n- Track the best thing so far (lowest price, farthest reach) in one scan.\n- Level-by-level greed (Jump Game II): the reach of one level defines the next.\n- Interval problems: find each element's last occurrence or sort by endpoint, then scan linearly.\n\n**How to prove it**:\n- **Exchange argument**: if an optimal solution differs from the greedy choice at some step, swapping in the greedy choice does not make it worse.\n- **Invariant**: show the quantity maintained at index i, such as the farthest reach, is always correct.\n\n**Beware**: many problems that look greedy need dynamic programming, such as stock trading with a cooldown. Look for a counterexample before coding."}, "example": {"title": {"zh": "例：prices = [7, 1, 5, 3, 6, 4]", "en": "Example: prices = [7, 1, 5, 3, 6, 4]"}, "body": {"zh": "维护目前最低价和最大利润。", "en": "Track the lowest price so far and the best profit."}, "traceColumns": ["price", "lowest", "best profit"], "trace": [{"state": {"price": "7", "lowest": "7", "best profit": "0"}, "note": {"zh": "第一天只能买。", "en": "On the first day you can only buy."}}, {"state": {"price": "1", "lowest": "1", "best profit": "0"}, "note": {"zh": "出现更低的买入价。", "en": "A cheaper buying price appears."}}, {"state": {"price": "5", "lowest": "1", "best profit": "4"}, "note": {"zh": "今天卖出可赚 4。", "en": "Selling today earns 4."}}, {"state": {"price": "3", "lowest": "1", "best profit": "4"}, "note": {"zh": "赚 2，不如之前。", "en": "Earns 2, worse than before."}}, {"state": {"price": "6", "lowest": "1", "best profit": "5"}, "note": {"zh": "今天卖出可赚 5，更新答案。", "en": "Selling today earns 5, a new best."}}]}, "check": [{"id": "why-safe", "prompt": {"zh": "为什么“以今天卖出时，最佳买入日是此前最低价那天”可以不加回溯地使用？", "en": "Why can 'the best buy day before today is the cheapest one' be used without backtracking?"}, "options": [{"zh": "最低价只会随着向右扫描而变得更低，之前的结论对今天仍成立", "en": "The lowest price only decreases as the scan moves right, so earlier conclusions stay valid"}, {"zh": "因为股价总是上涨", "en": "Because prices always rise"}, {"zh": "因为答案总是在最后一天", "en": "Because the answer is always on the last day"}], "answer": 0, "explanation": {"zh": "“此前最低价”是一个前缀最小值，可以在线维护，不需要回头。", "en": "The lowest earlier price is a prefix minimum maintained online, never revisited."}}, {"id": "counterexample", "prompt": {"zh": "“跳跃游戏 II”中，每次都跳到当前能到的最远位置，为什么可能不是最少跳数？", "en": "In Jump Game II, why might always jumping as far as possible not give the fewest jumps?"}, "options": [{"zh": "跳到最远处的落点本身可能跳不远；应该选“下一跳能到最远”的落点", "en": "The farthest landing spot may itself jump poorly; choose the spot whose next jump reaches farthest"}, {"zh": "因为最远位置可能越界", "en": "Because the farthest position may be out of range"}, {"zh": "它总是最少跳数", "en": "It always gives the fewest jumps"}], "answer": 0, "explanation": {"zh": "正确的贪心是按层推进：在本层所有位置中，取能让下一层到达最远的。", "en": "The correct greed advances by levels, using the positions in this level that make the next level reach farthest."}}], "practiceProblem": "best-time-to-buy-and-sell-stock", "reflectionPrompt": {"zh": "用交换论证解释“划分字母区间”的贪心为什么正确：为什么片段必须延伸到已见字母的最后出现位置，且不能更早结束？", "en": "Use an exchange argument for Partition Labels: why must a part extend to the last occurrence of every letter seen, and why can it not end earlier?"}}
