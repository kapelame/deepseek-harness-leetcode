summary: {"zh": "链表的每个节点除了 next 还有一个 random 指针（可指向任意节点或 null）。返回这个链表的深拷贝：新链表中的所有节点都是新建的。输入输出用 [val, random 指向的下标] 表示。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Each node has a random pointer to any node or null in addition to next. Return a deep copy in which every node is newly created. Inputs and outputs are written as [val, index the random pointer targets]. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "0 ≤ 节点数 ≤ 1000，-10⁴ ≤ Node.val ≤ 10⁴", "en": "0 ≤ nodes ≤ 1000, -10⁴ ≤ Node.val ≤ 10⁴"}]
params: [{"name": "head", "type": "json"}]
returns: "json"
shape: {"kind": "harness", "name": "random-list"}
