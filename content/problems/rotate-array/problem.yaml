hints: [{"zh": "k 可能大于数组长度。轮转 n 步之后数组会怎样？", "en": "k may exceed the length. What does rotating by n steps do?"}, {"zh": "轮转后，原来的最后 k 个元素到了最前面。能否用“翻转”做到？", "en": "After rotation, the last k elements come first. Can reversals achieve that?"}, {"zh": "先整体翻转，再分别翻转前 k 个和后 n-k 个，k 先对 n 取模。", "en": "Reverse the whole array, then reverse the first k and the last n-k, with k taken modulo n."}]
