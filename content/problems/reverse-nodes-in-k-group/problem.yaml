leetcode: {"frontendId": 25, "title": "Reverse Nodes in k-Group", "slug": "reverse-nodes-in-k-group", "difficulty": "hard", "tags": ["Linked List", "Recursion"], "paidOnly": false, "verifiedAt": "2026-10-14"}
summary: {"zh": "每 k 个节点一组进行翻转，最后不足 k 个的节点保持原顺序。只能改变节点连接，不能只改值。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Reverse the list in groups of k nodes; a final group shorter than k keeps its order. Relink nodes rather than changing values. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ k ≤ n ≤ 5000，0 ≤ Node.val ≤ 1000；进阶：O(1) 额外空间", "en": "1 ≤ k ≤ n ≤ 5000, 0 ≤ Node.val ≤ 1000; follow-up: O(1) extra space"}]
params: [{"name": "head", "type": "linked-list"}, {"name": "k", "type": "int"}]
returns: "linked-list"
comparator: {"kind": "exact"}
entry: {"python": "reverseKGroup", "typescript": "reverseKGroup"}
perCaseMs: 1000
inputs: [{"type": "linked-list", "minLength": 1, "maxLength": 5000, "smallMaxLength": 9, "largeLength": 5000, "min": 0, "max": 1000, "smallMin": 0, "smallMax": 9}, {"type": "int", "min": 1, "max": 1}]
hints: [{"zh": "先检查从当前位置开始是否还有 k 个节点。", "en": "First check whether k nodes remain from the current position."}, {"zh": "一组内部的翻转与“反转链表”相同；关键是翻转后与前后两部分重新接上。", "en": "Reversing inside a group is plain list reversal; the key is reconnecting it to the parts before and after."}, {"zh": "维护 groupPrev（上一组的尾）；翻转后，原组头变成组尾，把 groupPrev.next 指向新组头，再把 groupPrev 移到原组头。", "en": "Keep groupPrev, the tail of the previous group; after reversal the old group head becomes the tail, so point groupPrev.next at the new head and move groupPrev to the old head."}]
solution: {"explanation": {"zh": "逐组处理：确认够 k 个后原地翻转这一段，再把它接回前后部分。每个节点被访问常数次，时间 O(n)，空间 O(1)。", "en": "Group by group: once k nodes are confirmed, reverse that segment in place and splice it back. Each node is touched a constant number of times, O(n) time, O(1) space."}}
examples: [{"id": "ex-1", "args": [[1, 2, 3, 4, 5], 2], "expected": [2, 1, 4, 3, 5]}, {"id": "ex-2", "args": [[1, 2, 3, 4, 5], 3], "expected": [3, 2, 1, 4, 5]}]
