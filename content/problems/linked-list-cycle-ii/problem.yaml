summary: {"zh": "如果链表有环，返回环的入口节点；没有环返回 null。结果以入口节点在链表中的下标显示（null 显示为 -1）。不能修改链表。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "If the list has a cycle, return the node where the cycle begins, otherwise null. Results are shown as that node's index in the list (null as -1). Do not modify the list. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "0 ≤ 节点数 ≤ 10⁴，-10⁵ ≤ Node.val ≤ 10⁵；进阶：O(1) 额外空间", "en": "0 ≤ nodes ≤ 10⁴, -10⁵ ≤ Node.val ≤ 10⁵; follow-up: O(1) extra space"}]
