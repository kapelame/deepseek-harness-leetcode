inputs: [{"type": "linked-list", "minLength": 0, "maxLength": 100, "smallMaxLength": 8, "largeLength": 100, "min": 0, "max": 100}]
hints: [{"zh": "交换一对节点 a、b 时，需要改动哪几个指针？", "en": "Swapping a pair a, b changes which pointers?"}, {"zh": "需要前驱 prev：prev.next = b，a.next = b.next，b.next = a。", "en": "You need the predecessor prev: prev.next = b, a.next = b.next, b.next = a."}, {"zh": "从哑节点开始，每次处理一对后 prev 移到 a；剩下不足两个节点时停止。", "en": "Start from a dummy node; after each pair move prev to a; stop when fewer than two nodes remain."}]
solution: {"explanation": {"zh": "哑节点 + 每次重连三个指针，逐对推进。时间 O(n)，空间 O(1)。", "en": "A dummy node and three relinks per pair, advancing pair by pair. O(n) time, O(1) space."}}
examples: [{"id": "ex-1", "args": [[1, 2, 3, 4]], "expected": [2, 1, 4, 3]}, {"id": "ex-2", "args": [[]], "expected": []}, {"id": "ex-3", "args": [[1]], "expected": [1]}, {"id": "ex-4", "args": [[1, 2, 3]], "expected": [2, 1, 3]}]
