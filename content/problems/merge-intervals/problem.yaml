summary: {"zh": "合并所有重叠（包括端点相接）的区间，返回互不重叠且覆盖全部输入的区间，顺序不限。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Merge all overlapping intervals, including ones that only touch at an endpoint, and return non-overlapping intervals that cover the input, in any order. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ n ≤ 10⁴，0 ≤ start ≤ end ≤ 10⁴", "en": "1 ≤ n ≤ 10⁴, 0 ≤ start ≤ end ≤ 10⁴"}]
params: [{"name": "intervals", "type": "int[][]"}]
