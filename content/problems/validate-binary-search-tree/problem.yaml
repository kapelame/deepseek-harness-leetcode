hints: [{"zh": "只比较节点与它的直接孩子够吗？想一个反例。", "en": "Is comparing each node with its children enough? Find a counterexample."}, {"zh": "每个节点的取值都受祖先限制：它必须落在一个 (low, high) 开区间内。", "en": "Every node is bounded by its ancestors: it must lie in an open interval (low, high)."}, {"zh": "递归时把区间传下去；或利用“中序遍历严格递增”这一性质。", "en": "Pass the interval down the recursion, or use the fact that an inorder traversal must be strictly increasing."}]
solution: {"explanation": {"zh": "递归携带上下界，或检查中序序列严格递增。时间 O(n)，空间 O(h)。", "en": "Recurse with lower and upper bounds, or check that the inorder sequence is strictly increasing. O(n) time, O(h) space."}}
