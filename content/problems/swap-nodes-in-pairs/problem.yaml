summary: {"zh": "每两个相邻节点交换一次位置（交换节点本身，不能只改值），返回新的头节点。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Swap every two adjacent nodes by relinking them, not by changing values, and return the new head. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "0 ≤ 节点数 ≤ 100，0 ≤ Node.val ≤ 100", "en": "0 ≤ nodes ≤ 100, 0 ≤ Node.val ≤ 100"}]
params: [{"name": "head", "type": "linked-list"}]
returns: "linked-list"
comparator: {"kind": "exact"}
entry: {"python": "swapPairs", "typescript": "swapPairs"}
