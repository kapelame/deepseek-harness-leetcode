hints: [{"zh": "到达格子 (i, j) 的最后一步来自上方或左方。", "en": "The last move into (i, j) comes from above or from the left."}, {"zh": "paths[i][j] = paths[i-1][j] + paths[i][j-1]，第一行和第一列都是 1。", "en": "paths[i][j] = paths[i-1][j] + paths[i][j-1], with the first row and column all 1."}, {"zh": "一维数组即可：row[j] += row[j-1]。也可以直接用组合数 C(m+n-2, m-1)。", "en": "One row suffices: row[j] += row[j-1]. Or use the binomial C(m+n-2, m-1)."}]
solution: {"explanation": {"zh": "网格 DP，用一维数组滚动。时间 O(mn)，空间 O(n)。", "en": "Grid DP with one rolling row. O(mn) time, O(n) space."}}
examples: [{"id": "ex-1", "args": [3, 7], "expected": 28}, {"id": "ex-2", "args": [3, 2], "expected": 3}]
