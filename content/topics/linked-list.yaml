id: linked-list
order: 9
title: {"zh": "链表：指针重连、哑节点与快慢指针", "en": "Linked lists: relinking, dummy nodes, and fast/slow pointers"}
summary: {"zh": "链表题的核心是安全地改指针：先保存要用到的节点再改写，用哑节点消除头部特例，用快慢指针找中点、判环。", "en": "Linked-list problems are about changing pointers safely: save what you still need before overwriting, use a dummy node to remove head special cases, and use fast/slow pointers to find middles and cycles."}
prerequisites: [two-pointers]
problems: [reverse-linked-list, intersection-of-two-linked-lists, palindrome-linked-list, linked-list-cycle, linked-list-cycle-ii, merge-two-sorted-lists, add-two-numbers, remove-nth-node-from-end-of-list, swap-nodes-in-pairs, reverse-nodes-in-k-group, copy-list-with-random-pointer, sort-list, merge-k-sorted-lists]
variants: [linked-list-reverse-between, linked-list-merge-distinct]
lesson: {"motivation": {"zh": "音乐播放器把歌单存成链表：每首歌只知道下一首是谁。现在要把歌单倒过来播放。\n\n如果它是数组，交换首尾即可；但链表不能随机访问，只能沿 next 一个个走。更麻烦的是，一旦把某个节点的 next 改掉，原来的后继就丢失了。\n\n链表题几乎都是这种“边走边改指针”的问题。只要掌握三件事——改写前先保存、用哑节点统一头部、用快慢指针测量位置——大多数题都能写得又短又对。", "en": "A music player stores a playlist as a linked list: each song only knows the next one. Now the playlist must play in reverse.\n\nWith an array you would swap ends, but a list has no random access; you walk node by node along next. Worse, once a node's next is overwritten, its old successor is lost.\n\nAlmost every linked-list problem is this kind of walk-and-relink task. Master three moves, saving before overwriting, a dummy node for a uniform head, and fast/slow pointers for positions, and most solutions become short and correct."}, "strategy": {"zh": "**先存后改**：改写 `cur.next` 之前用变量保存原后继，例如反转：`nxt = cur.next; cur.next = prev; prev = cur; cur = nxt`。\n\n**哑节点**：在头部前放一个 `dummy`，删除头节点、合并链表时就不需要特判，最后返回 `dummy.next`。\n\n**快慢指针**：快指针一次两步、慢指针一次一步——快指针到尾时慢指针在中点；有环时二者必相遇，再从头同速前进可找到环入口。\n\n**前后指针**：让一个指针先走 n 步，两者同速前进，可定位倒数第 n 个节点。\n\n**复杂度**：这些技巧都是 O(n) 时间、O(1) 额外空间。画图——写出每一步指针的指向——是调试链表最可靠的方法。", "en": "**Save, then relink**: before overwriting `cur.next`, keep the old successor; reversal is `nxt = cur.next; cur.next = prev; prev = cur; cur = nxt`.\n\n**Dummy node**: put `dummy` before the head so deleting the head or merging needs no special case; return `dummy.next`.\n\n**Fast and slow pointers**: fast moves two steps, slow one; when fast reaches the end, slow is at the middle. With a cycle they must meet, and walking again from the head at equal speed finds the cycle entry.\n\n**Leader and follower**: let one pointer start n steps ahead and move both together to find the n-th node from the end.\n\n**Complexity**: all of these run in O(n) time and O(1) extra space. Drawing every pointer at each step is the most reliable way to debug a list."}, "example": {"title": {"zh": "例：反转 1 → 2 → 3", "en": "Example: reversing 1 → 2 → 3"}, "body": {"zh": "prev 是已反转部分的头，cur 是待处理的节点。", "en": "prev is the head of the reversed part; cur is the next node to process."}, "traceColumns": ["prev", "cur", "nxt", "reversed part"], "trace": [{"state": {"prev": "null", "cur": "1", "nxt": "2", "reversed part": "1 → null"}, "note": {"zh": "先保存 nxt = 2，再让 1 指向 prev。", "en": "Save nxt = 2, then point 1 at prev."}}, {"state": {"prev": "1", "cur": "2", "nxt": "3", "reversed part": "2 → 1 → null"}, "note": {"zh": "prev、cur 各前进一步，重复同样的三步。", "en": "prev and cur advance; repeat the same three moves."}}, {"state": {"prev": "2", "cur": "3", "nxt": "null", "reversed part": "3 → 2 → 1 → null"}, "note": {"zh": "cur 变成 null 时结束。", "en": "Stop when cur becomes null."}}, {"state": {"prev": "3", "cur": "null", "nxt": "—", "reversed part": "返回 prev = 3"}, "note": {"zh": "prev 就是新的头节点。", "en": "prev is the new head."}}]}, "check": [{"id": "save-first", "prompt": {"zh": "反转链表时，如果先执行 cur.next = prev 而不保存原来的 cur.next，会发生什么？", "en": "When reversing, what happens if you run cur.next = prev without saving the old cur.next?"}, "options": [{"zh": "剩余的链表丢失，无法继续前进", "en": "The rest of the list is lost and you cannot continue"}, {"zh": "没有影响，Python 会自动保存", "en": "Nothing; Python saves it automatically"}, {"zh": "链表会出现环", "en": "The list gains a cycle"}], "answer": 0, "explanation": {"zh": "cur.next 是到达后续节点的唯一途径，覆盖前必须保存。", "en": "cur.next is the only way to reach the remaining nodes, so it must be saved before overwriting."}}, {"id": "dummy", "prompt": {"zh": "删除倒数第 n 个节点时，哑节点解决了什么问题？", "en": "When removing the n-th node from the end, what does the dummy node solve?"}, "options": [{"zh": "待删的是头节点时也有前驱，不需要特判", "en": "The head has a predecessor too, so deleting it needs no special case"}, {"zh": "让链表长度变成偶数", "en": "It makes the length even"}, {"zh": "避免使用快慢指针", "en": "It avoids fast/slow pointers"}], "answer": 0, "explanation": {"zh": "删除需要前驱节点；哑节点保证每个真实节点都有前驱。", "en": "Deletion needs a predecessor; the dummy gives every real node one."}}], "practiceProblem": "reverse-linked-list", "reflectionPrompt": {"zh": "画出反转 1 → 2 → 3 时每一步 prev、cur、nxt 的指向，并解释循环为什么在 cur 为 null 时结束。", "en": "Draw prev, cur, and nxt at each step of reversing 1 → 2 → 3, and explain why the loop stops when cur is null."}}
