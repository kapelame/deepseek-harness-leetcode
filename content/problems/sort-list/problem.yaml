hints: [{"zh": "哪种 O(n log n) 排序适合链表，不需要随机访问？", "en": "Which O(n log n) sort suits a linked list, since it needs no random access?"}, {"zh": "归并排序：用快慢指针找中点断开，分别排序两半，再合并两个有序链表。", "en": "Merge sort: split at the middle with slow and fast pointers, sort both halves, and merge the two sorted lists."}, {"zh": "自底向上的归并可以做到 O(1) 额外空间：按 1、2、4… 的长度两两合并。", "en": "Bottom-up merge sort reaches O(1) extra space: merge runs of length 1, 2, 4, and so on."}]
