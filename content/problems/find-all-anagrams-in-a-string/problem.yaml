summary: {"zh": "在字符串 s 中找出所有是 p 的字母异位词（字符相同、顺序可不同）的子串，返回这些子串的起始下标，顺序不限。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Find every substring of s that is an anagram of p (same letters in any order) and return their start indices in any order. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ |s|, |p| ≤ 3×10⁴，只含小写字母", "en": "1 ≤ |s|, |p| ≤ 3×10⁴, lowercase letters only"}]
params: [{"name": "s", "type": "string"}, {"name": "p", "type": "string"}]
returns: "int[]"
