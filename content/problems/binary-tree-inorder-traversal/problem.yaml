hints: [{"zh": "递归版本只有三行：遍历左子树、记录根、遍历右子树。", "en": "The recursive version is three lines: left subtree, record the root, right subtree."}, {"zh": "迭代版本用栈模拟递归：一路向左把节点压栈。", "en": "The iterative version simulates recursion with a stack: push nodes while going left."}, {"zh": "栈顶弹出时记录它的值，然后转向它的右子树，继续“一路向左”。", "en": "When popping, record the value, then turn to its right subtree and go left again."}]
solution: {"explanation": {"zh": "用显式栈模拟递归：压入左链，弹出时访问并转向右子树。时间 O(n)，空间 O(h)。", "en": "An explicit stack simulates recursion: push the left chain, visit on pop, then turn right. O(n) time, O(h) space."}}
