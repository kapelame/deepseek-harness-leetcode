summary: {"zh": "给定一棵（节点值互不相同的）二叉树的先序遍历和中序遍历，重建并返回这棵树。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Given the preorder and inorder traversals of a tree with distinct values, rebuild and return the tree. (Original summary written for Learn; see LeetCode for the official statement.)"}
