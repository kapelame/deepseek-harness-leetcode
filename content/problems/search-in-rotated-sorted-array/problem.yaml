hints: [{"zh": "从中点切开后，左右两半中至少有一半是有序的。", "en": "After splitting at the middle, at least one half is sorted."}, {"zh": "比较 nums[lo] 与 nums[mid] 判断哪一半有序。", "en": "Compare nums[lo] with nums[mid] to tell which half is sorted."}, {"zh": "若 target 落在有序那一半的范围内，就去那一半；否则去另一半。", "en": "If target lies within the sorted half's range, search there; otherwise search the other half."}]
solution: {"explanation": {"zh": "二分时先判断哪一侧有序，再根据 target 是否落在该侧范围决定方向。时间 O(log n)，空间 O(1)。", "en": "At each step determine the sorted side and go there only if target falls within its range. O(log n) time, O(1) space."}}
