hints: [{"zh": "最小值就是旋转点。拿 nums[mid] 和谁比较能判断旋转点在哪一侧？", "en": "The minimum is the rotation point. Comparing nums[mid] with what tells you its side?"}, {"zh": "和 nums[hi] 比较：nums[mid] > nums[hi] 说明最小值在 mid 右边。", "en": "Compare with nums[hi]: if nums[mid] > nums[hi], the minimum lies right of mid."}, {"zh": "否则最小值在 [lo, mid]（mid 本身可能就是最小值），令 hi = mid；lo == hi 时结束。", "en": "Otherwise it is in [lo, mid], since mid itself may be the minimum; set hi = mid and stop when lo == hi."}]
solution: {"explanation": {"zh": "与右端点比较的二分：始终保持最小值在 [lo, hi] 中。时间 O(log n)，空间 O(1)。", "en": "Binary search against the right end keeps the minimum inside [lo, hi]. O(log n) time, O(1) space."}}
