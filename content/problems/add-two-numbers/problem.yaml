hints: [{"zh": "逆序存放有什么好处？想想手算加法从哪一位开始。", "en": "Why is reverse order convenient? Think about where hand addition starts."}, {"zh": "同时遍历两条链表，逐位相加并维护进位。", "en": "Walk both lists together, adding digit by digit with a carry."}, {"zh": "某条链表先结束时把它的数字当作 0；循环结束后若进位为 1，还要追加一个节点。", "en": "Treat a finished list's digit as 0; if a carry of 1 remains at the end, append one more node."}]
solution: {"explanation": {"zh": "模拟竖式加法：逐位相加 (d1 + d2 + carry)，节点值为和的个位，进位为十位。时间 O(max(m, n))，空间 O(1)（不计输出）。", "en": "Simulate column addition: add d1 + d2 + carry digit by digit, store the ones digit, and carry the tens. O(max(m, n)) time, O(1) extra space besides the output."}}
