id: "graph-minimum-semesters"
version: 1
suiteVersion: 1
parentProblemId: "course-schedule"
topicId: "graph"
title: {"zh": "修完所有课程的最少学期数", "en": "Fewest Semesters to Finish Every Course"}
summary: {"zh": "每学期可以修任意多门先修课已完成的课程，求修完全部课程的最少学期数；有环则返回 -1。", "en": "Each semester you may take any number of courses whose prerequisites are done; return the fewest semesters to finish them all, or -1 if impossible."}
statement: {"zh": "共有 `n` 门课程，编号 `0..n-1`。`relations[i] = [a, b]` 表示必须先修完课程 `b`，才能修课程 `a`。\n\n每个学期可以同时修**任意多门**课程，只要它们的先修课程都已在之前的学期修完。返回修完所有课程所需的**最少学期数**；如果无法修完（存在循环依赖），返回 `-1`。", "en": "There are `n` courses numbered `0..n-1`. `relations[i] = [a, b]` means course `b` must be completed before course `a`.\n\nIn each semester you may take **any number** of courses as long as all their prerequisites were completed in earlier semesters. Return the **fewest semesters** needed to finish every course, or `-1` if that is impossible because of a cyclic dependency."}
difficulty: medium
skills: ["topological sort", "BFS by levels"]
differences: [{"category": "output", "description": {"zh": "从“能否完成”变成“最少需要几轮”，答案等于拓扑排序的层数。", "en": "From whether it is possible to how many rounds it takes; the answer is the number of topological levels."}}, {"category": "reasoning", "description": {"zh": "需要按层处理队列，而不是一个个取出。", "en": "The queue must be processed level by level instead of one node at a time."}}]
transfer: {"zh": "Kahn 拓扑排序（入度为 0 入队、删除出边）保持不变，环的判断也不变；新增的是按层计数，层数就是学期数。", "en": "Kahn's topological sort and its cycle test carry over unchanged; the addition is counting levels, which are semesters."}
entry: {"python": "minimumSemesters", "typescript": "minimumSemesters"}
params: [{"name": "n", "type": "int"}, {"name": "relations", "type": "int[][]"}]
returns: "int"
comparator: {"kind": "exact"}
perCaseMs: 1000
inputs: [{"type": "int", "min": 1, "max": 5000}, {"type": "int[][]"}]
constraints: [{"zh": "1 ≤ n ≤ 5000，0 ≤ relations.length ≤ 5000，关系互不重复且 a ≠ b", "en": "1 ≤ n ≤ 5000, 0 ≤ relations.length ≤ 5000, distinct pairs with a ≠ b"}]
examples: [{"args": [3, [[1, 0], [2, 0]]], "expected": 2}, {"args": [3, [[1, 0], [2, 1], [0, 2]]], "expected": -1}, {"args": [4, [[1, 0], [2, 1], [3, 0]]], "expected": 3}]
boundaryCases: [{"args": [1, []]}, {"args": [2, []]}, {"args": [2, [[1, 0]]]}, {"args": [2, [[1, 0], [0, 1]]]}, {"args": [4, [[3, 2], [2, 1], [1, 0]]]}]
hints: [{"zh": "把第一学期能修的课都放进队列：哪些课？", "en": "Which courses can be taken in the first semester? Put them all in the queue."}, {"zh": "一个学期结束后，修完的课会让一些后续课程的入度变为 0，它们就是下一学期能修的课。", "en": "When a semester ends, finished courses drop some successors to in-degree 0; those form the next semester."}, {"zh": "按层处理队列并计数层数；若最终修完的课程少于 n，返回 -1。", "en": "Process the queue level by level and count the levels; return -1 if fewer than n courses were taken."}]
