id: backtracking
order: 12
title: {"zh": "回溯：在决策树上做选择、递归、撤销", "en": "Backtracking: choose, explore, undo on a decision tree"}
summary: {"zh": "当答案是“所有满足条件的组合/排列/划分”时，把构造过程画成决策树，DFS 遍历它：做选择、递归、撤销选择，并尽早剪掉不可能的分支。", "en": "When the answer is every combination, permutation, or split that satisfies a rule, draw construction as a decision tree and DFS through it: choose, recurse, undo, and prune impossible branches early."}
prerequisites: [trees]
problems: [subsets, permutations, letter-combinations-of-a-phone-number, combination-sum, generate-parentheses, word-search, palindrome-partitioning, n-queens]
variants: [backtracking-subsets-with-duplicates, backtracking-combination-sum-once]
lesson: {"motivation": {"zh": "你在规划周末：有电影、徒步、读书三件事可选，想列出所有可能的安排组合，好和朋友商量。\n\n三件事时可以手写；十件事时有 1024 种组合，必须系统地枚举，而且不能漏、不能重。\n\n把“对每件事决定做或不做”看成一棵决策树：每一层是一件事，每个分支是一种选择，每片叶子是一种完整的安排。回溯就是在这棵树上做深度优先搜索——向下走时做选择，返回时撤销选择。", "en": "You are planning a weekend with three options, a film, a hike, and a book, and want to list every possible combination to discuss with friends.\n\nWith three you can write them out; with ten there are 1024 combinations, which you must enumerate systematically without missing or repeating any.\n\nSee \"decide yes or no for each option\" as a decision tree: each level is an option, each branch a choice, each leaf a complete plan. Backtracking is a depth-first search of that tree: make a choice going down and undo it coming back."}, "strategy": {"zh": "**模板**：\n```\ndef dfs(状态):\n    if 到达叶子: 记录答案; return\n    for 选择 in 当前可选:\n        if 不合法: continue      # 剪枝\n        做选择\n        dfs(新状态)\n        撤销选择\n```\n\n**去重的三种方式**：\n- 组合/子集：规定元素按下标递增选取（递归从 start 开始），避免 [1,2] 与 [2,1]。\n- 输入有重复值：排序后，同一层中跳过与前一个相同的值（`i > start and nums[i] == nums[i-1]`）。\n- 排列：用 used 数组标记已选元素。\n\n**剪枝**：剩余目标为负、括号不合法、与已放皇后冲突时立即返回。\n\n**复杂度**：与答案数量相关，例如子集 O(n·2ⁿ)、排列 O(n·n!)。", "en": "**Template**:\n```\ndef dfs(state):\n    if at a leaf: record the answer; return\n    for choice in available choices:\n        if invalid: continue      # prune\n        make the choice\n        dfs(new state)\n        undo the choice\n```\n\n**Three ways to avoid duplicates**:\n- Combinations and subsets: pick elements in increasing index order (recurse from start) so [1,2] and [2,1] are one answer.\n- Repeated input values: sort, then skip a value equal to its predecessor within the same level (`i > start and nums[i] == nums[i-1]`).\n- Permutations: mark chosen elements in a used array.\n\n**Pruning**: return immediately when the remaining target is negative, parentheses become invalid, or a queen conflicts.\n\n**Complexity**: proportional to the number of answers, for example O(n·2ⁿ) for subsets and O(n·n!) for permutations."}, "example": {"title": {"zh": "例：nums = [1, 2, 3] 的子集", "en": "Example: subsets of [1, 2, 3]"}, "body": {"zh": "dfs(start) 一进入就记录当前路径，再从 start 往后尝试加入元素。", "en": "dfs(start) records the current path on entry, then tries adding each element from start onward."}, "traceColumns": ["call", "path recorded", "next choices"], "trace": [{"state": {"call": "dfs(0)", "path recorded": "[]", "next choices": "1, 2, 3"}, "note": {"zh": "空集也是子集。", "en": "The empty set is a subset too."}}, {"state": {"call": "dfs(1)", "path recorded": "[1]", "next choices": "2, 3"}, "note": {"zh": "选了 1 之后，只能从 1 的后面继续选。", "en": "After choosing 1, only later elements may follow."}}, {"state": {"call": "dfs(2)", "path recorded": "[1, 2]", "next choices": "3"}, "note": {"zh": "继续向下：[1, 2, 3] 随后被记录。", "en": "Going deeper records [1, 2, 3] next."}}, {"state": {"call": "撤销 2，选 3", "path recorded": "[1, 3]", "next choices": "—"}, "note": {"zh": "回溯：弹出 2，尝试同层的下一个选择。", "en": "Backtrack: pop 2 and try the next choice at that level."}}, {"state": {"call": "回到 dfs(0)，选 2", "path recorded": "[2], [2, 3], [3]", "next choices": "—"}, "note": {"zh": "从 start 开始保证 [2, 1] 不会出现。", "en": "Starting from start guarantees [2, 1] never appears."}}]}, "check": [{"id": "undo", "prompt": {"zh": "回溯中“撤销选择”这一步的作用是什么？", "en": "What does the undo step accomplish in backtracking?"}, "options": [{"zh": "让共享的路径/状态恢复到进入该分支之前，供同层的下一个选择使用", "en": "It restores the shared path and state so the next choice at the same level starts clean"}, {"zh": "删除已经记录的答案", "en": "It deletes recorded answers"}, {"zh": "让递归提前结束", "en": "It ends the recursion early"}], "answer": 0, "explanation": {"zh": "所有分支共用同一个 path，返回前必须恢复，否则兄弟分支会带着错误的状态出发。", "en": "All branches share one path; it must be restored before returning, or sibling branches start from the wrong state."}}, {"id": "duplicates", "prompt": {"zh": "nums = [1, 2, 2] 求不重复子集时，排序后为什么跳过“同一层中与前一个相同的值”？", "en": "For distinct subsets of [1, 2, 2], why skip a value equal to its predecessor within the same level after sorting?"}, "options": [{"zh": "同一层选第一个 2 和第二个 2 会产生完全相同的子树", "en": "Choosing the first or the second 2 at one level yields identical subtrees"}, {"zh": "因为重复值不能出现在任何子集中", "en": "Because repeated values cannot appear in any subset"}, {"zh": "为了让结果按字典序排列", "en": "To sort the results lexicographically"}], "answer": 0, "explanation": {"zh": "[2, 2] 仍然合法：它来自不同层（先选第一个 2，下一层再选第二个 2）；只有同一层的重复选择才会产生重复子集。", "en": "[2, 2] is still valid because the two 2s are chosen at different levels; only repeated choices within one level create duplicate subsets."}}], "practiceProblem": "subsets", "reflectionPrompt": {"zh": "画出 nums = [1, 2] 时子集回溯的决策树，标出每次记录答案和撤销选择的位置。", "en": "Draw the decision tree of subset backtracking for [1, 2], marking where answers are recorded and choices undone."}}
