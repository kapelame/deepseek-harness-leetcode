summary: {"zh": "判断二叉树是否为有效的二叉搜索树：每个节点的左子树所有值都严格小于它，右子树所有值都严格大于它。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Report whether the tree is a valid binary search tree: every value in a node's left subtree is strictly smaller and every value in its right subtree strictly larger. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ 节点数 ≤ 10⁴，-2³¹ ≤ Node.val ≤ 2³¹-1", "en": "1 ≤ nodes ≤ 10⁴, -2³¹ ≤ Node.val ≤ 2³¹-1"}]
params: [{"name": "root", "type": "tree"}]
returns: "bool"
