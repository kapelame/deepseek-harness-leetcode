summary: {"zh": "返回数组中出现次数超过 ⌊n/2⌋ 的元素（保证存在）。进阶：O(n) 时间、O(1) 空间。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Return the element that appears more than ⌊n/2⌋ times; it always exists. Follow-up: O(n) time, O(1) space. (Original summary written for Learn; see LeetCode for the official statement.)"}
