summary: {"zh": "找出数组中没有出现的最小正整数。要求 O(n) 时间、O(1) 额外空间。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Return the smallest positive integer missing from the array, in O(n) time and O(1) extra space. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ n ≤ 10⁵，-2³¹ ≤ nums[i] ≤ 2³¹-1", "en": "1 ≤ n ≤ 10⁵, -2³¹ ≤ nums[i] ≤ 2³¹-1"}]
