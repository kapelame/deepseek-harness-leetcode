hints: [{"zh": "每行恰好放一个皇后，所以可以逐行决定它在哪一列。", "en": "Each row holds exactly one queen, so decide its column row by row."}, {"zh": "记录已占用的列、主对角线（r - c）和副对角线（r + c）。", "en": "Track occupied columns, main diagonals (r - c), and anti-diagonals (r + c)."}, {"zh": "放下皇后后递归下一行，返回时把三个集合恢复。", "en": "After placing a queen, recurse to the next row and restore the three sets on return."}]
solution: {"explanation": {"zh": "逐行回溯，用三个集合 O(1) 判断冲突。搜索量远小于 nⁿ。", "en": "Row-by-row backtracking with three sets for O(1) conflict checks; the search is far smaller than nⁿ."}}
