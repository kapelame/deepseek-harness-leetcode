summary: {"zh": "网格中 \"1\" 表示陆地、\"0\" 表示水。上下左右相连的陆地组成一个岛屿，统计岛屿数量。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "In a grid, \"1\" is land and \"0\" is water. Land cells connected up, down, left, or right form an island; count the islands. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ m, n ≤ 300，grid[i][j] 为 \"0\" 或 \"1\"", "en": "1 ≤ m, n ≤ 300, grid[i][j] is \"0\" or \"1\""}]
