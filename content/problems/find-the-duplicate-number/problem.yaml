entry: {"python": "findDuplicate", "typescript": "findDuplicate"}
perCaseMs: 1000
inputs: [{"type": "int[]", "minLength": 1}]
hints: [{"zh": "把下标 i 看成链表节点，nums[i] 看成 next 指针，会得到什么结构？", "en": "Treat index i as a list node and nums[i] as its next pointer. What structure appears?"}, {"zh": "从 0 出发沿 next 走，一定会进入环；重复的数就是环的入口（有两个节点指向它）。", "en": "Walking from 0 along next must enter a cycle; the duplicate is the cycle entry, since two nodes point to it."}, {"zh": "用 Floyd 判圈找到相遇点，再从起点与相遇点同速前进，相遇处即答案。", "en": "Use Floyd's algorithm to find the meeting point, then walk from the start and from the meeting point at equal speed; they meet at the answer."}]
solution: {"explanation": {"zh": "把数组看成函数 f(i) = nums[i] 构成的链表，重复值是环入口，Floyd 判圈 O(n) 时间、O(1) 空间。也可以对值域二分计数。", "en": "View the array as the list f(i) = nums[i]; the duplicate is the cycle entry, found by Floyd's algorithm in O(n) time and O(1) space. Binary search over the value range also works."}}
examples: [{"id": "ex-1", "args": [[1, 3, 4, 2, 2]], "expected": 2}, {"id": "ex-2", "args": [[3, 1, 3, 4, 2]], "expected": 3}, {"id": "ex-3", "args": [[3, 3, 3, 3, 3]], "expected": 3}]
