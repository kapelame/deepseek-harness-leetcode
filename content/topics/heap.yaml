id: heap
order: 13
title: {"zh": "堆：只关心“当前最大/最小”的有序结构", "en": "Heaps: ordered structures that only track the current extreme"}
summary: {"zh": "当只需要反复取出最大（或最小）的元素、或只保留前 k 个时，用堆代替完整排序：插入和弹出 O(log n)，查看堆顶 O(1)。", "en": "When you repeatedly need the largest or smallest element, or only the top k, use a heap instead of a full sort: insert and pop in O(log n), peek in O(1)."}
prerequisites: [hashing]
problems: [kth-largest-element-in-an-array, top-k-frequent-elements]
variants: [heap-running-kth-largest, heap-top-k-frequent-words]
lesson: {"motivation": {"zh": "一场比赛有 10 万名选手陆续交卷，主办方只想实时显示前 10 名的最低分（入围线）。\n\n每来一份成绩就把所有成绩重新排序，太慢了。其实只需要保留当前的前 10 名，并能随时知道其中最低的是谁——新成绩比它高就把它挤掉。\n\n“随时知道最小（或最大）的那个、并能快速替换”正是堆擅长的事。", "en": "A contest receives 100,000 submissions over time, and the organizers only want to show the lowest score among the current top 10, the cut-off line.\n\nRe-sorting every score on each submission is too slow. All you need is to keep the current top 10 and always know the lowest of them; a higher new score pushes it out.\n\nAlways knowing the smallest (or largest) element and replacing it quickly is exactly what a heap does."}, "strategy": {"zh": "**堆的操作**：push / pop 为 O(log n)，查看堆顶 O(1)，建堆 O(n)。Python 的 heapq 是最小堆，最大堆可以存相反数。\n\n**前 k 大**：维护大小为 k 的**最小**堆，堆顶就是第 k 大；新元素比堆顶大才替换。总时间 O(n log k)。\n\n**按频率取前 k**：先用哈希表计数，再对 (频率, 值) 用大小为 k 的堆。\n\n**多路归并 / 动态中位数**：堆维护 k 个候选头；两个堆分别保存较小一半和较大一半。\n\n**比较**：只需要前 k 个时，堆比完整排序 O(n log n) 更省；需要全部有序时直接排序。", "en": "**Heap operations**: push and pop are O(log n), peeking O(1), building O(n). Python's heapq is a min-heap; store negatives for a max-heap.\n\n**Top k**: keep a size-k **min**-heap; its top is the k-th largest, replaced only when a new element is larger. O(n log k) overall.\n\n**Top k by frequency**: count with a hash map, then use a size-k heap over (frequency, value).\n\n**k-way merges and running medians**: a heap holds the k candidate heads; two heaps hold the smaller and larger halves.\n\n**When to use**: when only the top k matter, a heap beats a full O(n log n) sort; when everything must be ordered, just sort."}, "example": {"title": {"zh": "例：nums = [3, 2, 1, 5, 6, 4]，k = 2", "en": "Example: nums = [3, 2, 1, 5, 6, 4], k = 2"}, "body": {"zh": "最小堆只保留目前最大的 2 个数。", "en": "The min-heap keeps only the two largest numbers so far."}, "traceColumns": ["x", "heap", "top"], "trace": [{"state": {"x": "3, 2", "heap": "[2, 3]", "top": "2"}, "note": {"zh": "前 k 个直接放入。", "en": "The first k go straight in."}}, {"state": {"x": "1", "heap": "[2, 3]", "top": "2"}, "note": {"zh": "1 不比堆顶大，丢弃。", "en": "1 is not above the top, so it is dropped."}}, {"state": {"x": "5", "heap": "[3, 5]", "top": "3"}, "note": {"zh": "5 > 2，替换堆顶。", "en": "5 > 2, so it replaces the top."}}, {"state": {"x": "6", "heap": "[5, 6]", "top": "5"}, "note": {"zh": "6 > 3，替换堆顶。", "en": "6 > 3, so it replaces the top."}}, {"state": {"x": "4", "heap": "[5, 6]", "top": "5"}, "note": {"zh": "4 不比 5 大；第 2 大是 5。", "en": "4 is not above 5; the second largest is 5."}}]}, "check": [{"id": "min-heap", "prompt": {"zh": "求第 k 大时，为什么用大小为 k 的最小堆而不是最大堆？", "en": "For the k-th largest, why a size-k min-heap rather than a max-heap?"}, "options": [{"zh": "最小堆的堆顶正好是前 k 大中最小的，即第 k 大，也是最该被挤出的那个", "en": "Its top is the smallest of the top k, which is both the answer and the element to evict"}, {"zh": "最小堆插入更快", "en": "Min-heaps insert faster"}, {"zh": "Python 只支持最小堆", "en": "Python only supports min-heaps"}], "answer": 0, "explanation": {"zh": "新元素只需与“前 k 大里最弱的”比较，这正是最小堆的堆顶。", "en": "A newcomer only competes with the weakest of the top k, exactly the min-heap's top."}}, {"id": "complexity", "prompt": {"zh": "n 个元素、大小为 k 的堆，求前 k 大的总时间是多少？", "en": "With n elements and a size-k heap, what is the total time for the top k?"}, "options": [{"zh": "O(n log k)", "en": "O(n log k)"}, {"zh": "O(n log n)", "en": "O(n log n)"}, {"zh": "O(nk)", "en": "O(nk)"}], "answer": 0, "explanation": {"zh": "每个元素至多一次 O(log k) 的堆操作。", "en": "Each element costs at most one O(log k) heap operation."}}], "practiceProblem": "kth-largest-element-in-an-array", "reflectionPrompt": {"zh": "如果数据是一个无限的流，你会如何随时回答“当前第 k 大是多少”？说明堆里保存什么、何时更新。", "en": "If the data were an endless stream, how would you answer 'what is the k-th largest now' at any moment? Say what the heap holds and when it changes."}}
