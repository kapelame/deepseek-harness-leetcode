hints: [{"zh": "用集合记录访问过的节点可以做，但需要 O(n) 空间。", "en": "A set of visited nodes works but costs O(n) space."}, {"zh": "两个人在环形跑道上跑，速度不同，会发生什么？", "en": "Two runners on a circular track at different speeds: what happens?"}, {"zh": "慢指针每次走一步、快指针每次走两步；有环必相遇，无环快指针先到 null。", "en": "Slow moves one step, fast moves two; with a cycle they meet, without one fast reaches null first."}]
solution: {"explanation": {"zh": "Floyd 判圈：快指针每步比慢指针多走一个节点，进入环后距离每步缩小 1，必然相遇。时间 O(n)，空间 O(1)。", "en": "Floyd's cycle detection: inside a cycle the fast pointer closes the gap by one node per step, so they must meet. O(n) time, O(1) space."}}
