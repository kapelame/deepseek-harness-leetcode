summary: {"zh": "矩阵每行从左到右递增、每列从上到下递增，判断 target 是否在矩阵中。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Each row increases left to right and each column increases top to bottom; report whether target is in the matrix. (Original summary written for Learn; see LeetCode for the official statement.)"}
