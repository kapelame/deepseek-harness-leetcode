summary: {"zh": "设计数据结构，支持不断加入整数（addNum）并随时返回当前所有数的中位数（findMedian；偶数个时取中间两数的平均值）。findMedian 只在至少加入一个数之后调用。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Design a structure that keeps accepting integers (addNum) and returns the median of everything so far at any time (findMedian; the mean of the middle two for an even count). findMedian is only called after at least one addNum. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "-10⁵ ≤ num ≤ 10⁵，调用总次数 ≤ 5×10⁴；答案误差不超过 10⁻⁵", "en": "-10⁵ ≤ num ≤ 10⁵, at most 5×10⁴ calls; answers within 10⁻⁵ are accepted"}]
