perCaseMs: 1000
inputs: [{"type": "string[][]", "minLength": 1, "maxLength": 300, "smallMaxLength": 5, "largeLength": 200, "row": {"minLength": 1, "maxLength": 300, "smallMaxLength": 5, "largeLength": 200}, "cell": {"alphabet": "01", "maxLength": 1}}]
hints: [{"zh": "每遇到一块还没访问过的陆地，就发现了一个新岛屿。", "en": "Every unvisited land cell you meet starts a new island."}, {"zh": "从它出发用 DFS 或 BFS 把整个岛屿标记为已访问。", "en": "From it, mark the whole island visited with DFS or BFS."}, {"zh": "可以直接把访问过的 \"1\" 改成 \"0\"，省去 visited 数组；用显式栈避免深递归。", "en": "You can overwrite visited \"1\" cells with \"0\" instead of a visited array, and use an explicit stack to avoid deep recursion."}]
solution: {"explanation": {"zh": "扫描网格，遇到陆地就计数并用 BFS/DFS 淹没整个连通块。每个格子访问常数次，时间 O(mn)，空间 O(mn)。", "en": "Scan the grid; each land cell found increments the count and a BFS/DFS sinks its whole component. Every cell is touched a constant number of times, O(mn) time and space."}}
