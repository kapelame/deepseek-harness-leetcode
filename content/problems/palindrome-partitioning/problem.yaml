hints: [{"zh": "第一刀切在哪里？切下的前缀必须是回文。", "en": "Where does the first cut go? The prefix cut off must be a palindrome."}, {"zh": "对每个回文前缀，递归处理剩下的后缀。", "en": "For each palindromic prefix, recurse on the remaining suffix."}, {"zh": "可以先用动态规划预处理 isPal[i][j]，让每次判断 O(1)。", "en": "Precompute isPal[i][j] with dynamic programming so each check is O(1)."}]
solution: {"explanation": {"zh": "回溯枚举切分位置，只沿回文前缀深入；预处理回文表后每步判断 O(1)。最坏 O(n·2ⁿ)。", "en": "Backtracking enumerates cut positions, descending only through palindromic prefixes; a precomputed palindrome table makes each check O(1). Worst case O(n·2ⁿ)."}}
