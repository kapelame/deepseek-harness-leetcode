hints: [{"zh": "先用快慢指针判断是否有环。相遇点和入口点之间有什么关系？", "en": "First detect the cycle with slow and fast pointers. How does the meeting point relate to the entry?"}, {"zh": "设头到入口距离 a，入口到相遇点距离 b，环长 c。快指针走过的路程是慢指针的两倍，可推出 a ≡ c - b (mod c)。", "en": "Let a be head-to-entry, b entry-to-meeting, c the cycle length. Fast travels twice as far as slow, which gives a ≡ c - b (mod c)."}, {"zh": "相遇后，把一个指针放回头部，两个指针都每次走一步，再次相遇处就是入口。", "en": "After meeting, move one pointer back to the head and step both one node at a time; they meet again at the entry."}]
solution: {"explanation": {"zh": "Floyd 算法第二阶段：从头和从相遇点同时出发、同速前进，会在环入口相遇。时间 O(n)，空间 O(1)。", "en": "The second phase of Floyd's algorithm: walking at equal speed from the head and from the meeting point, the pointers meet at the cycle entry. O(n) time, O(1) space."}}
examples: [{"id": "ex-1", "args": [[3, 2, 0, -4], 1], "expected": 1}, {"id": "ex-2", "args": [[1, 2], 0], "expected": 0}, {"id": "ex-3", "args": [[1], -1], "expected": -1}]
