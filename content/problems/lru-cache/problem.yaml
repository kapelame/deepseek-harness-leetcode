summary: {"zh": "实现容量为 capacity 的 LRU（最近最少使用）缓存：get 返回键对应的值（不存在为 -1），put 写入或更新键值；超出容量时淘汰最久未被访问的键。get 和 put 都应为 O(1)。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Implement an LRU cache with a given capacity: get returns a key's value or -1, and put inserts or updates a key; when over capacity, evict the least recently used key. Both operations should be O(1). (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ capacity ≤ 3000，0 ≤ key ≤ 10⁴，0 ≤ value ≤ 10⁵，调用总次数 ≤ 2×10⁵", "en": "1 ≤ capacity ≤ 3000, 0 ≤ key ≤ 10⁴, 0 ≤ value ≤ 10⁵, at most 2×10⁵ calls"}]
