perCaseMs: 1000
inputs: [{"type": "json"}]
hints: [{"zh": "难点在于：复制某个节点的 random 时，它指向的节点可能还没被复制。", "en": "The difficulty: when copying a node's random pointer, its target may not be copied yet."}, {"zh": "先建立“原节点 → 新节点”的映射，再第二遍连接 next 和 random。", "en": "First build a map from original to copy, then connect next and random in a second pass."}, {"zh": "O(1) 额外空间：把每个新节点插在原节点后面，random 就是 orig.random.next，最后拆成两条链表。", "en": "O(1) extra space: weave each copy right after its original, so a copy's random is orig.random.next, then split the lists."}]
solution: {"explanation": {"zh": "哈希表映射原节点到新节点，两遍完成 next 和 random 的连接。时间 O(n)，空间 O(n)；交织法可降到 O(1) 额外空间。", "en": "A hash map from originals to copies; two passes connect next and random. O(n) time and space; weaving the copies into the original list reduces extra space to O(1)."}}
