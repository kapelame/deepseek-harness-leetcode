constraints: [{"zh": "1 ≤ n ≤ 20，-1000 ≤ matrix[i][j] ≤ 1000", "en": "1 ≤ n ≤ 20, -1000 ≤ matrix[i][j] ≤ 1000"}]
examples: [{"args": [[[1, 2], [3, 4]]], "expected": [[2, 4], [1, 3]]}, {"args": [[[1, 2, 3], [4, 5, 6], [7, 8, 9]]], "expected": [[3, 6, 9], [2, 5, 8], [1, 4, 7]]}]
boundaryCases: [{"args": [[[1]]]}, {"args": [[[0, 1], [2, 3]]]}, {"args": [[[5, 1, 9, 11], [2, 4, 8, 10], [13, 3, 6, 7], [15, 14, 12, 16]]]}]
hints: [{"zh": "逆时针旋转后，第一行变成了哪里？", "en": "After a counter-clockwise rotation, where does the first row go?"}, {"zh": "第一行变成第一列（自下而上读）。试试先转置，再看还差什么。", "en": "The first row becomes the first column, read bottom to top. Try transposing first and see what is left."}, {"zh": "转置后再上下翻转（翻转行的顺序）即可；或先左右翻转每行再转置。", "en": "After transposing, reverse the order of the rows; or reverse each row first and then transpose."}]
