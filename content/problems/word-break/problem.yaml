summary: {"zh": "判断字符串 s 能否被拆分成一个或多个字典中的单词（单词可重复使用）。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Decide whether s can be split into one or more dictionary words, reusing words freely. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ |s| ≤ 300，1 ≤ 字典大小 ≤ 1000，1 ≤ 单词长度 ≤ 20，均为小写字母，单词互不相同", "en": "1 ≤ |s| ≤ 300, 1 ≤ dictionary size ≤ 1000, 1 ≤ word length ≤ 20, lowercase, distinct words"}]
params: [{"name": "s", "type": "string"}, {"name": "wordDict", "type": "string[]"}]
