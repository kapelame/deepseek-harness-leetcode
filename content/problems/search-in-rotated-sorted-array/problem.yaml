summary: {"zh": "一个元素互不相同的升序数组在某个位置被旋转过（如 [4,5,6,7,0,1,2]）。在其中查找 target，返回下标，不存在返回 -1。要求 O(log n)。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "A sorted array of distinct values was rotated at some pivot (such as [4,5,6,7,0,1,2]). Return the index of target or -1, in O(log n). (Original summary written for Learn; see LeetCode for the official statement.)"}
