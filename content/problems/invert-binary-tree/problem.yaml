id: invert-binary-tree
kind: leetcode
version: 1
suiteVersion: 1
title: { zh: "翻转二叉树", en: "Invert Binary Tree" }
difficulty: easy
topics: [trees]
leetcode: { frontendId: 226, title: "Invert Binary Tree", slug: invert-binary-tree, difficulty: easy, tags: [Tree, Depth-First Search, Breadth-First Search, Binary Tree], paidOnly: false, verifiedAt: "2026-10-14" }
summary:
  zh: 交换二叉树中每个节点的左右子树（镜像翻转），返回翻转后的根节点。（本课程原创简述，完整题面见 LeetCode 官方页面。）
  en: Swap the left and right subtrees of every node (mirror the tree) and return the root. (Original summary written for Learn; see LeetCode for the official statement.)
constraints:
  - { zh: "节点数在 [0, 100] 范围内", en: "The number of nodes is in [0, 100]" }
  - { zh: "-100 ≤ Node.val ≤ 100", en: "-100 ≤ Node.val ≤ 100" }
params:
  - { name: root, type: tree }
returns: tree
comparator: { kind: exact }
entry: { python: invertTree, typescript: invertTree }
perCaseMs: 1000
inputs:
  - { type: tree, minLength: 0, smallMaxLength: 9, largeLength: 100, min: -100, max: 100 }
hints:
  - { zh: "翻转整棵树，和翻转它的两棵子树有什么关系？", en: "How does mirroring the whole tree relate to mirroring its two subtrees?" }
  - { zh: "镜像后的树：左子树是原右子树的镜像，右子树是原左子树的镜像。", en: "In the mirror, the left subtree is the mirror of the old right subtree and vice versa." }
  - { zh: "递归：空节点直接返回；否则先翻转左右子树，再交换 root.left 和 root.right。", en: "Recurse: return empty nodes as they are; otherwise mirror both subtrees and swap root.left with root.right." }
solution:
  explanation:
    zh: 对每个节点交换左右孩子，并递归处理子树（前序或后序均可）。时间 O(n)，空间 O(h)。
    en: Swap each node's children and recurse into the subtrees (pre-order or post-order). O(n) time, O(h) space.
examples:
  - { id: ex-1, args: [[4, 2, 7, 1, 3]], expected: [4, 7, 2, null, null, 3, 1] }
  - { id: ex-2, args: [[]], expected: [] }
boundaryCases:
  - args: [[1]]
  - args: [[1, 2]]
  - args: [[1, null, 2]]
  - args: [[5, 3, 8, 1, 4, 7, 9]]
