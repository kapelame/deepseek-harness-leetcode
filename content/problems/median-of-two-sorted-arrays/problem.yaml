summary: {"zh": "给定两个升序数组，求合并后的中位数，要求 O(log(m+n))。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Given two sorted arrays, return the median of their union in O(log(m+n)). (Original summary written for Learn; see LeetCode for the official statement.)"}
