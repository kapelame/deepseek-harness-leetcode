summary: {"zh": "生成所有由 n 对括号组成的合法括号串，顺序不限。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Generate every well-formed string of n pairs of parentheses, in any order. (Original summary written for Learn; see LeetCode for the official statement.)"}
