hints: [{"zh": "不知道长度时，如何定位倒数第 n 个？", "en": "Without knowing the length, how do you find the n-th node from the end?"}, {"zh": "让一个指针先走 n 步，然后两个指针一起走；先走的到达末尾时，后走的在哪里？", "en": "Let one pointer go n steps ahead, then move both; when the leader reaches the end, where is the follower?"}, {"zh": "从哑节点出发，后指针会停在待删节点的前一个，直接跳过它即可；哑节点处理删除头节点的情况。", "en": "Start both from a dummy node so the follower stops just before the target and can skip it; the dummy handles deleting the head."}]
