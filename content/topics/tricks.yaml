id: tricks
order: 15
title: {"zh": "技巧：位运算、投票与原地划分", "en": "Tricks: bit operations, voting, and in-place partitioning"}
summary: {"zh": "一些问题有专门的小技巧：异或抵消成对元素，摩尔投票找众数，三指针原地划分，把数组看成链表用快慢指针找重复。它们都能在 O(n) 时间、O(1) 空间内完成。", "en": "Some problems have dedicated tricks: XOR cancels pairs, Boyer–Moore voting finds a majority, three pointers partition in place, and viewing an array as a linked list finds a duplicate with fast/slow pointers. All run in O(n) time and O(1) space."}
prerequisites: [two-pointers, linked-list]
problems: [single-number, majority-element, sort-colors, next-permutation, find-the-duplicate-number]
variants: [tricks-two-singles, tricks-majority-third]
lesson: {"motivation": {"zh": "一个仓库里每种零件都恰好成对入库，只有一件落单了。清点员只带了一个计算器，没有纸可以记录。\n\n要找出落单的那件，常规做法是记录每种零件出现的次数——这需要“纸”（额外空间）。\n\n异或运算有一个神奇的性质：a ⊕ a = 0。把所有零件编号依次异或，成对的互相抵消，最后计算器上剩下的就是落单的那件。很多“O(1) 空间”的要求，都要靠这样的数学性质来满足。", "en": "A warehouse receives every part in pairs except one lonely item, and the clerk has only a calculator, no paper to write on.\n\nThe usual approach counts each part type, which needs paper, extra space.\n\nXOR has a remarkable property: a ⊕ a = 0. XOR every part number in turn and the pairs cancel; what remains on the calculator is the lonely part. Many O(1)-space requirements are met by mathematical properties like this."}, "strategy": {"zh": "**异或**：a ⊕ a = 0，a ⊕ 0 = a，满足交换律和结合律。全部异或可消去成对元素；两个落单数时，用异或结果的某个 1 位把数分成两组。\n\n**摩尔投票**：不同的元素两两抵消。出现次数 > n/2 的元素抵消后一定剩下；推广到 > n/3 时维护两个候选，最后再计数验证。\n\n**荷兰国旗**：low、i、high 三个指针把数组分成 0、1、未处理、2 四个区域，一次遍历原地排序。\n\n**数组即链表**：值域为 [1, n] 时，把 i → nums[i] 看成 next 指针，重复值就是环的入口，用 Floyd 判圈。\n\n**下一个排列**：找最右的上升点，与后缀中最小的较大值交换，再反转后缀。", "en": "**XOR**: a ⊕ a = 0 and a ⊕ 0 = a, commutative and associative. XORing everything cancels pairs; with two lonely numbers, a set bit of the XOR splits the values into two groups.\n\n**Boyer–Moore voting**: different elements cancel in pairs. An element appearing more than n/2 times survives; for more than n/3, keep two candidates and verify with a final count.\n\n**Dutch national flag**: pointers low, i, and high split the array into 0s, 1s, unprocessed, and 2s for a one-pass in-place sort.\n\n**Array as a linked list**: with values in [1, n], treat i → nums[i] as next pointers; the duplicate is the cycle entry, found with Floyd's algorithm.\n\n**Next permutation**: find the rightmost ascent, swap it with the smallest larger value in the suffix, then reverse the suffix."}, "example": {"title": {"zh": "例：摩尔投票 nums = [2, 2, 1, 1, 1, 2, 2]", "en": "Example: Boyer–Moore voting on [2, 2, 1, 1, 1, 2, 2]"}, "body": {"zh": "计数为 0 时更换候选；相同加一，不同减一。", "en": "At count 0 switch candidates; add one for a match, subtract one otherwise."}, "traceColumns": ["x", "candidate", "count"], "trace": [{"state": {"x": "2, 2", "candidate": "2", "count": "2"}, "note": {"zh": "候选 2 获得两票。", "en": "Candidate 2 gains two votes."}}, {"state": {"x": "1, 1", "candidate": "2", "count": "0"}, "note": {"zh": "两个 1 抵消两个 2。", "en": "Two 1s cancel two 2s."}}, {"state": {"x": "1", "candidate": "1", "count": "1"}, "note": {"zh": "计数为 0，换成候选 1。", "en": "The count is 0, so 1 becomes the candidate."}}, {"state": {"x": "2", "candidate": "1", "count": "0"}, "note": {"zh": "被抵消。", "en": "Cancelled."}}, {"state": {"x": "2", "candidate": "2", "count": "1"}, "note": {"zh": "最终候选 2 就是众数。", "en": "The final candidate, 2, is the majority."}}]}, "check": [{"id": "xor", "prompt": {"zh": "为什么把所有数异或起来就能得到只出现一次的数？", "en": "Why does XORing all numbers yield the one that appears once?"}, "options": [{"zh": "异或满足交换律与结合律，成对的数 a ⊕ a = 0 互相抵消，0 ⊕ x = x", "en": "XOR is commutative and associative, pairs give a ⊕ a = 0, and 0 ⊕ x = x"}, {"zh": "异或相当于求和再取模", "en": "XOR is a sum modulo something"}, {"zh": "因为只出现一次的数最大", "en": "Because the single number is the largest"}], "answer": 0, "explanation": {"zh": "顺序无关，所有成对的数都会消成 0。", "en": "Order does not matter, so every pair collapses to 0."}}, {"id": "verify", "prompt": {"zh": "推广到“出现次数 > n/3”时，为什么最后还要再数一遍两个候选？", "en": "When generalizing to more than n/3, why recount the two candidates at the end?"}, "options": [{"zh": "投票只保证真正的答案一定在候选中，但候选不一定都满足条件", "en": "Voting only guarantees the true answers are among the candidates, not that both qualify"}, {"zh": "为了排序输出", "en": "To sort the output"}, {"zh": "投票过程会改变数组", "en": "Voting modifies the array"}], "answer": 0, "explanation": {"zh": "例如 [1, 2, 3] 结束时也会留下候选，但没有任何数超过 n/3。", "en": "For [1, 2, 3], candidates remain at the end although no value exceeds n/3."}}], "practiceProblem": "single-number", "reflectionPrompt": {"zh": "解释“寻找重复数”中，为什么把 i → nums[i] 看成链表后，重复的数正好是环的入口。", "en": "Explain why, viewing i → nums[i] as a linked list in Find the Duplicate Number, the duplicate is exactly the cycle entry."}}
