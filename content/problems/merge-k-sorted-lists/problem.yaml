hints: [{"zh": "每次都要从 k 个链表头中取最小的那个。怎样快速找到最小值？", "en": "Each step takes the smallest of k heads. How do you find it quickly?"}, {"zh": "用最小堆保存各链表当前的头节点（值、编号、节点），弹出最小者并把它的 next 放回堆。", "en": "Keep the current heads in a min-heap of (value, index, node); pop the smallest and push its next."}, {"zh": "也可以分治：两两合并，log k 轮完成。", "en": "Alternatively divide and conquer: merge in pairs over log k rounds."}]
solution: {"explanation": {"zh": "最小堆维护 k 个候选头节点，每次取出最小者，总时间 O(N log k)，空间 O(k)；分治两两合并具有同样的复杂度。", "en": "A min-heap holds the k candidate heads and yields the smallest each time, O(N log k) time and O(k) space; pairwise divide and conquer has the same bound."}}
