hints: [{"zh": "相交指的是同一个节点对象，不只是值相等。", "en": "Intersection means the same node object, not just an equal value."}, {"zh": "如果两条链表长度相同，同步前进就会在交点相遇。长度不同时怎么办？", "en": "If both lists had equal length, walking in lockstep would meet at the junction. What if they differ?"}, {"zh": "指针 a 走完 A 后转到 B 的头，指针 b 走完 B 后转到 A 的头；两者走过的总长度相同，会在交点（或同时为 null）相遇。", "en": "Pointer a walks A then B, pointer b walks B then A; both cover the same total length and meet at the junction, or at null together."}]
solution: {"explanation": {"zh": "双指针换道：两个指针各自走完自己的链表后切到对方的头部，走过的总步数相同，因此同时到达交点或同时到达末尾。时间 O(m + n)，空间 O(1)。", "en": "Switch-track pointers: each pointer finishes its own list and then starts on the other's head, so both cover the same distance and reach the junction, or the end, together. O(m + n) time, O(1) space."}}
