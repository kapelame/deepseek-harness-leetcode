hints: [{"zh": "每一步，结果链表的下一个节点应该来自哪里？", "en": "At each step, where should the next node of the result come from?"}, {"zh": "比较两条链表的当前头节点，取较小的接到结果尾部。", "en": "Compare the two current heads and append the smaller one to the result."}, {"zh": "用一个哑节点（dummy）简化头部处理；一条链表用完后，把另一条剩余部分整体接上。", "en": "A dummy node simplifies the head; when one list runs out, attach the rest of the other."}]
solution: {"explanation": {"zh": "哑节点 + 双指针：每次接上较小的头节点，最后接上剩余部分。时间 O(m + n)，空间 O(1)。", "en": "Dummy node plus two pointers: append the smaller head each time, then attach the remainder. O(m + n) time, O(1) space."}}
