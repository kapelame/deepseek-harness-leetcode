id: design
order: 11
title: {"zh": "数据结构设计：组合基础结构满足操作的复杂度要求", "en": "Data-structure design: combine basic structures to meet operation costs"}
summary: {"zh": "设计题先列出每个操作的复杂度要求，再把哈希表、链表、栈、堆、字典树组合起来，让每种结构负责一种能力。", "en": "In design problems, list the required cost of every operation first, then combine hash maps, linked lists, stacks, heaps, and tries so that each structure provides one ability."}
prerequisites: [stack, linked-list]
problems: [min-stack, implement-trie-prefix-tree, lru-cache, find-median-from-data-stream]
variants: [design-min-queue, design-mru-cache]
lesson: {"motivation": {"zh": "浏览器要缓存最近访问过的 100 个网页：命中时立即返回，满了就丢掉最久没访问过的那个。\n\n只用哈希表，查找很快，但不知道谁最久没用；只用链表按时间排序，删除最旧的很快，但查找要遍历。\n\n设计题的套路就是：把需求拆成几种能力（查找、排序、取最小、前缀匹配…），每种能力交给擅长它的结构，再让这些结构互相指向，保持同步。", "en": "A browser caches the 100 most recently visited pages: hits return immediately, and when full it drops the page unused for the longest time.\n\nA hash map alone finds pages fast but cannot tell which is oldest; a list ordered by time removes the oldest fast but needs a scan to find a page.\n\nThe design recipe: split the requirements into abilities (lookup, ordering, minimum, prefix matching), give each ability to the structure that does it best, and have the structures point at each other so they stay in sync."}, "strategy": {"zh": "**先写复杂度表**：每个操作需要 O(1)？O(log n)？这决定了能用哪些结构。\n\n**常见组合**：\n- 哈希表 + 双向链表 → O(1) 查找 + O(1) 按使用顺序移动/删除（LRU）。\n- 栈中每个元素附带“到此为止的最小值” → O(1) getMin。\n- 大顶堆 + 小顶堆 → 动态中位数。\n- 字典树 → 按前缀查找。\n\n**不变量**：写清楚每个结构始终保持的性质（例如“链表头是最近使用的”“两个堆大小相差 ≤ 1”），每个操作结束前恢复它。\n\n**测试**：设计题按操作序列测试，注意空结构、容量为 1、重复键等边界。", "en": "**Write the cost table first**: does each operation need O(1), O(log n)? That decides which structures qualify.\n\n**Common combinations**:\n- Hash map + doubly linked list → O(1) lookup and O(1) reordering or removal by use (LRU).\n- Stack entries carrying the minimum so far → O(1) getMin.\n- Max-heap + min-heap → running median.\n- Trie → prefix lookups.\n\n**Invariants**: state what each structure always maintains (\"the list head is the most recent\", \"heap sizes differ by at most 1\") and restore it before each operation returns.\n\n**Testing**: design problems are tested with operation sequences; watch empty structures, capacity 1, and repeated keys."}, "example": {"title": {"zh": "例：MinStack 依次 push(-2)、push(0)、push(-3)、pop", "en": "Example: MinStack push(-2), push(0), push(-3), pop"}, "body": {"zh": "每个元素保存 (值, 到此为止的最小值)。", "en": "Each entry stores (value, minimum so far)."}, "traceColumns": ["operation", "stack", "getMin"], "trace": [{"state": {"operation": "push(-2)", "stack": "(-2,-2)", "getMin": "-2"}, "note": {"zh": "第一个元素的最小值就是自己。", "en": "The first entry's minimum is itself."}}, {"state": {"operation": "push(0)", "stack": "(-2,-2) (0,-2)", "getMin": "-2"}, "note": {"zh": "0 不比 -2 小，记录的最小值仍是 -2。", "en": "0 is not below -2, so the recorded minimum stays -2."}}, {"state": {"operation": "push(-3)", "stack": "… (-3,-3)", "getMin": "-3"}, "note": {"zh": "新的最小值随元素一起入栈。", "en": "The new minimum is pushed with the element."}}, {"state": {"operation": "pop()", "stack": "(-2,-2) (0,-2)", "getMin": "-2"}, "note": {"zh": "弹出后，栈顶记录的最小值自动恢复为 -2。", "en": "After popping, the top's recorded minimum is -2 again."}}]}, "check": [{"id": "lru-structures", "prompt": {"zh": "LRU 缓存中，双向链表负责什么？", "en": "In an LRU cache, what is the doubly linked list for?"}, "options": [{"zh": "按使用时间排序，O(1) 移动和淘汰节点", "en": "Ordering by use, moving and evicting nodes in O(1)"}, {"zh": "按键查找值", "en": "Looking up values by key"}, {"zh": "保存所有被淘汰的键", "en": "Remembering evicted keys"}], "answer": 0, "explanation": {"zh": "查找由哈希表负责；链表保持使用顺序，哈希表中存节点指针使移动 O(1)。", "en": "The hash map handles lookup; the list keeps usage order, and storing node pointers in the map makes moves O(1)."}}, {"id": "median-heaps", "prompt": {"zh": "用两个堆求中位数时，较小的一半应该放在哪种堆里？", "en": "With two heaps for the median, which kind of heap holds the smaller half?"}, "options": [{"zh": "大顶堆，这样能 O(1) 拿到较小一半中最大的数", "en": "A max-heap, to read the largest of the smaller half in O(1)"}, {"zh": "小顶堆", "en": "A min-heap"}, {"zh": "都可以", "en": "Either works"}], "answer": 0, "explanation": {"zh": "中位数位于较小一半的最大值与较大一半的最小值之间。", "en": "The median sits between the smaller half's maximum and the larger half's minimum."}}], "practiceProblem": "min-stack", "reflectionPrompt": {"zh": "为 LRU 缓存写出 get 和 put 两个操作分别需要维护的不变量，并说明为什么单独用哈希表做不到 O(1) 淘汰。", "en": "Write the invariants get and put must maintain in an LRU cache, and explain why a hash map alone cannot evict in O(1)."}}
