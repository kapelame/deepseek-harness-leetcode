id: dynamic-programming
order: 16
title: {"zh": "动态规划：定义状态、写出转移、按顺序填表", "en": "Dynamic programming: define states, write transitions, fill in order"}
summary: {"zh": "当问题可以拆成重叠的子问题、且最优解由子问题的最优解组成时，用表格记住每个子问题的答案，避免重复计算。核心是把“状态”和“转移”写清楚。", "en": "When a problem splits into overlapping subproblems whose best answers build the overall best, record each subproblem's answer in a table instead of recomputing it. The heart of it is stating the state and the transition precisely."}
prerequisites: [backtracking]
problems: [house-robber, climbing-stairs, pascals-triangle, perfect-squares, coin-change, word-break, longest-increasing-subsequence, maximum-product-subarray, partition-equal-subset-sum, longest-valid-parentheses, unique-paths, minimum-path-sum, longest-palindromic-substring, longest-common-subsequence, edit-distance]
variants: [dp-house-robber-circle, dp-coin-change-combinations]
lesson: {"motivation": {"zh": "一个小偷沿街作案，每间房子里有一定的钱，但相邻两间房子不能都偷，否则会触发警报。他想偷到尽可能多的钱。\n\n用回溯枚举每间房偷或不偷，有 2ⁿ 种方案。但仔细看：决定“前 i 间房最多能偷多少”时，只需要知道“前 i-1 间”和“前 i-2 间”的最优结果——这些子问题被反复用到。\n\n把每个子问题的答案存进表里，从小到大依次计算，指数级的搜索就变成了一次线性扫描。这就是动态规划。", "en": "A thief walks down a street where each house holds some money, but robbing two adjacent houses trips the alarm. He wants the most money possible.\n\nBacktracking over rob or skip for each house tries 2ⁿ plans. Look closer: the best haul from the first i houses only needs the best from the first i-1 and the first i-2 houses, and those subproblems are reused again and again.\n\nStore each subproblem's answer in a table and compute them from small to large, and the exponential search becomes one linear scan. That is dynamic programming."}, "strategy": {"zh": "**四步法**：\n1. **状态**：dp[i]（或 dp[i][j]）表示什么？要精确到“前 i 个”“以 i 结尾”“长度为 i”。\n2. **转移**：dp[i] 如何由更小的状态得到？列出最后一步的所有可能选择。\n3. **初始值**：最小子问题的答案，例如 dp[0]。\n4. **顺序**：保证计算 dp[i] 时，它依赖的状态都已算好。\n\n**常见类型**：\n- 线性 DP：打家劫舍、爬楼梯、最长递增子序列。\n- 背包：零钱兑换（完全背包）、分割等和子集（0-1 背包）——注意内外循环顺序。\n- 二维/网格 DP：路径数、最小路径和。\n- 双序列 DP：最长公共子序列、编辑距离——dp[i][j] 看两个前缀。\n\n**空间优化**：如果 dp[i] 只依赖前一两行/前一两个值，可以用滚动变量或一维数组。", "en": "**Four steps**:\n1. **State**: what does dp[i] (or dp[i][j]) mean? Be precise: \"the first i items\", \"ending at i\", \"of length i\".\n2. **Transition**: how does dp[i] follow from smaller states? List every possible last step.\n3. **Base cases**: answers to the smallest subproblems, such as dp[0].\n4. **Order**: make sure every state dp[i] depends on is computed first.\n\n**Common families**:\n- Linear DP: house robber, climbing stairs, longest increasing subsequence.\n- Knapsack: coin change (unbounded), partition equal subset sum (0-1); mind the loop order.\n- Grid DP: path counts, minimum path sums.\n- Two-sequence DP: longest common subsequence, edit distance, where dp[i][j] looks at two prefixes.\n\n**Space**: when dp[i] depends only on the previous one or two values or rows, keep rolling variables or a single row."}, "example": {"title": {"zh": "例：打家劫舍 nums = [2, 7, 9, 3, 1]", "en": "Example: house robber on [2, 7, 9, 3, 1]"}, "body": {"zh": "dp[i] = 前 i 间房最多能偷的钱 = max(dp[i-1], dp[i-2] + nums[i-1])。", "en": "dp[i] = the most from the first i houses = max(dp[i-1], dp[i-2] + nums[i-1])."}, "traceColumns": ["i", "house", "skip it", "rob it", "dp[i]"], "trace": [{"state": {"i": "1", "house": "2", "skip it": "0", "rob it": "0+2", "dp[i]": "2"}, "note": {"zh": "只有一间房，偷。", "en": "With one house, rob it."}}, {"state": {"i": "2", "house": "7", "skip it": "2", "rob it": "0+7", "dp[i]": "7"}, "note": {"zh": "偷第二间比第一间多。", "en": "Robbing the second beats the first."}}, {"state": {"i": "3", "house": "9", "skip it": "7", "rob it": "2+9", "dp[i]": "11"}, "note": {"zh": "偷第 1、3 间。", "en": "Rob houses 1 and 3."}}, {"state": {"i": "4", "house": "3", "skip it": "11", "rob it": "7+3", "dp[i]": "11"}, "note": {"zh": "不偷第 4 间更好。", "en": "Skipping house 4 is better."}}, {"state": {"i": "5", "house": "1", "skip it": "11", "rob it": "11+1", "dp[i]": "12"}, "note": {"zh": "答案 12：偷第 1、3、5 间。", "en": "Answer 12: houses 1, 3, and 5."}}]}, "check": [{"id": "state", "prompt": {"zh": "最长递增子序列中，dp[i] 定义为“以 nums[i] 结尾的最长递增子序列长度”，为什么要强调“结尾”？", "en": "In longest increasing subsequence, dp[i] is the longest increasing subsequence ending at nums[i]. Why insist on 'ending at'?"}, "options": [{"zh": "转移时需要知道子序列最后一个元素，才能判断能否接上 nums[i]", "en": "The transition must know the subsequence's last element to decide whether nums[i] can extend it"}, {"zh": "为了节省空间", "en": "To save space"}, {"zh": "因为答案总是 dp[n-1]", "en": "Because the answer is always dp[n-1]"}], "answer": 0, "explanation": {"zh": "“以 i 结尾”让我们知道最后一个元素就是 nums[i]，转移 dp[i] = max(dp[j]) + 1（nums[j] < nums[i]）才成立；最终答案是所有 dp[i] 的最大值。", "en": "Ending at i fixes the last element as nums[i], which makes dp[i] = max(dp[j]) + 1 over nums[j] < nums[i] valid; the answer is the maximum over all dp[i]."}}, {"id": "knapsack-order", "prompt": {"zh": "零钱兑换 II（求组合数）中，外层循环遍历硬币、内层循环遍历金额，为什么不会把 1+2 和 2+1 算成两种？", "en": "In coin change II, counting combinations, why does looping coins outside and amounts inside avoid counting 1+2 and 2+1 twice?"}, "options": [{"zh": "硬币按固定顺序被考虑，每种组合只按这个顺序被构造一次", "en": "Coins are considered in a fixed order, so each combination is built once in that order"}, {"zh": "因为 dp 数组是一维的", "en": "Because the dp array is one-dimensional"}, {"zh": "因为金额从小到大遍历", "en": "Because amounts go from small to large"}], "answer": 0, "explanation": {"zh": "交换内外层循环就会按“最后一枚硬币”区分，从而统计排列数。", "en": "Swapping the loops distinguishes sequences by their last coin and counts permutations instead."}}], "practiceProblem": "house-robber", "reflectionPrompt": {"zh": "为“编辑距离”写出 dp[i][j] 的定义和三种转移（插入、删除、替换），并解释为什么 dp[i][0] = i。", "en": "Write the definition of dp[i][j] for edit distance and its three transitions (insert, delete, replace), and explain why dp[i][0] = i."}}
