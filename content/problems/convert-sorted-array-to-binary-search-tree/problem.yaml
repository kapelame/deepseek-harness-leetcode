summary: {"zh": "把严格递增的数组转换成一棵高度平衡的二叉搜索树（每个节点左右子树高度差不超过 1）。答案不唯一，任意满足条件的树都算正确。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Convert a strictly increasing array into a height-balanced binary search tree, where no node's subtrees differ in height by more than 1. Any valid tree is accepted. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ n ≤ 10⁴，-10⁴ ≤ nums[i] ≤ 10⁴，严格递增", "en": "1 ≤ n ≤ 10⁴, -10⁴ ≤ nums[i] ≤ 10⁴, strictly increasing"}]
