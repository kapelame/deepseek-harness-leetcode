hints: [{"zh": "把螺旋看成一层一层剥开的边框。", "en": "Think of the spiral as peeling off one border layer at a time."}, {"zh": "维护上、下、左、右四条边界，每走完一条边就收缩对应边界。", "en": "Keep top, bottom, left, and right bounds; shrink the matching bound after each side."}, {"zh": "只剩一行或一列时，注意不要重复访问。", "en": "When a single row or column remains, avoid visiting it twice."}]
solution: {"explanation": {"zh": "模拟四条边界：依次输出上边、右边、下边、左边并收缩边界，直到边界交错。时间 O(mn)，额外空间 O(1)。", "en": "Simulate four bounds: emit the top, right, bottom, and left sides and shrink the bounds until they cross. O(mn) time, O(1) extra space."}}
