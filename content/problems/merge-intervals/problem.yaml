hints: [{"zh": "如果区间按起点排好序，哪些区间可能会重叠？", "en": "If intervals are sorted by start, which ones can overlap?"}, {"zh": "排序后，新区间只可能和结果中的最后一个区间重叠。", "en": "After sorting, a new interval can only overlap the last interval in the result."}, {"zh": "起点 ≤ 上一个终点就合并（终点取较大值），否则追加新区间。", "en": "Merge when its start ≤ the last end (keep the larger end); otherwise append it."}]
solution: {"explanation": {"zh": "按起点排序后线性扫描，每个区间要么扩展结果中最后一个区间，要么开启新区间。时间 O(n log n)，空间 O(n)。", "en": "Sort by start and scan once; each interval either extends the last merged interval or starts a new one. O(n log n) time, O(n) space."}}
