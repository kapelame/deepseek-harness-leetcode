hints: [{"zh": "所有腐烂橘子同时向外扩散。这是哪种搜索？", "en": "All rotten oranges spread at the same time. Which search is that?"}, {"zh": "多源 BFS：把所有初始腐烂的橘子一起放进队列，按层扩散，层数就是分钟数。", "en": "Multi-source BFS: start with every rotten orange in the queue and spread level by level; the levels are minutes."}, {"zh": "BFS 结束后若仍有新鲜橘子，返回 -1；没有新鲜橘子时答案为 0。", "en": "If a fresh orange remains after the BFS, return -1; with no fresh oranges at all the answer is 0."}]
solution: {"explanation": {"zh": "多源 BFS 按层推进，层数即时间，最后检查是否还有新鲜橘子。时间 O(mn)，空间 O(mn)。", "en": "Multi-source BFS advances level by level, levels being minutes, then checks for remaining fresh oranges. O(mn) time and space."}}
