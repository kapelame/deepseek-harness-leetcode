summary: {"zh": "给定互不相同的整数数组，返回它的所有子集（幂集），不能包含重复子集，顺序不限。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Given distinct integers, return every subset (the power set) without duplicates, in any order. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ n ≤ 10，-10 ≤ nums[i] ≤ 10，元素互不相同", "en": "1 ≤ n ≤ 10, -10 ≤ nums[i] ≤ 10, all distinct"}]
params: [{"name": "nums", "type": "int[]"}]
returns: "int[][]"
comparator: {"kind": "unordered-nested"}
entry: {"python": "subsets", "typescript": "subsets"}
