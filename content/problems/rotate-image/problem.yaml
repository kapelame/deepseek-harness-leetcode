hints: [{"zh": "顺时针旋转后，元素 (i, j) 去了哪里？", "en": "After a clockwise rotation, where does element (i, j) go?"}, {"zh": "旋转 = 转置（沿主对角线翻转）+ 每行左右翻转。", "en": "Rotation = transpose (flip across the main diagonal) + reverse each row."}, {"zh": "也可以按层，每次把四个对应位置循环交换。", "en": "Alternatively, rotate layer by layer, cycling four matching cells at a time."}]
solution: {"explanation": {"zh": "先转置再翻转每一行，两步都是原地交换。时间 O(n²)，额外空间 O(1)。", "en": "Transpose, then reverse every row; both steps swap in place. O(n²) time, O(1) extra space."}}
