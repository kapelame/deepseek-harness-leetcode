summary: {"zh": "返回两个字符串的最长公共子序列的长度（子序列可以不连续但要保持相对顺序）。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Return the length of the longest common subsequence of two strings; a subsequence keeps relative order but need not be contiguous. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ |text1|, |text2| ≤ 1000，只含小写字母", "en": "1 ≤ |text1|, |text2| ≤ 1000, lowercase letters"}]
params: [{"name": "text1", "type": "string"}, {"name": "text2", "type": "string"}]
