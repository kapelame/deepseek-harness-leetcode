summary: {"zh": "数组有 n+1 个整数，都在 [1, n] 范围内，恰好有一个数重复出现（可能出现多次）。不修改数组、只用 O(1) 额外空间，找出这个重复的数。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "The array has n+1 integers in [1, n] and exactly one value repeats, possibly several times. Find it without modifying the array, using O(1) extra space. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ n ≤ 10⁵，nums.length = n + 1，1 ≤ nums[i] ≤ n", "en": "1 ≤ n ≤ 10⁵, nums.length = n + 1, 1 ≤ nums[i] ≤ n"}]
params: [{"name": "nums", "type": "int[]"}]
returns: "int"
