hints: [{"zh": "一条最长路径一定在某个节点“拐弯”。经过节点 x 拐弯的最长路径有多长？", "en": "Every longest path turns at some node. How long is the longest path turning at node x?"}, {"zh": "它等于 x 左子树的高度 + 右子树的高度。", "en": "It equals the height of x's left subtree plus the height of its right subtree."}, {"zh": "后序遍历计算每个节点的高度，同时用全局变量更新 左高 + 右高 的最大值。", "en": "Compute heights in post-order and update a running maximum of left height + right height."}]
solution: {"explanation": {"zh": "一次后序遍历：返回子树高度，同时在每个节点处更新经过它的最长路径。时间 O(n)，空间 O(h)。", "en": "One post-order pass returns subtree heights while updating the longest path through each node. O(n) time, O(h) space."}}
