hints: [{"zh": "边扫描边置零会污染后面的判断。需要先记住什么？", "en": "Zeroing while scanning corrupts later checks. What must you remember first?"}, {"zh": "记录哪些行、哪些列需要清零，再统一处理。", "en": "Record which rows and columns must be cleared, then clear them."}, {"zh": "O(1) 空间：用第一行、第一列做标记，另用两个变量记录第一行、第一列自身是否含 0。", "en": "O(1) space: use the first row and column as markers, plus two flags for whether they contain a 0 themselves."}]
