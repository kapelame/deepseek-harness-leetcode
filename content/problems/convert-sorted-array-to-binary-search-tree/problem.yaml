inputs: [{"type": "int[]", "minLength": 1, "smallMaxLength": 9, "largeLength": 5000, "min": -10000, "max": 10000, "sorted": "asc", "distinct": true}]
hints: [{"zh": "为了平衡，根应该选哪个元素？", "en": "To stay balanced, which element should be the root?"}, {"zh": "选中间元素作根，左半部分构成左子树，右半部分构成右子树。", "en": "Pick the middle element as the root; the left half forms the left subtree and the right half the right subtree."}, {"zh": "对两半递归同样的过程；用下标区间避免复制数组。", "en": "Recurse on both halves, passing index ranges instead of copying."}]
solution: {"explanation": {"zh": "分治：中点为根，左右两半递归建树，两侧节点数相差至多 1，高度自然平衡。时间 O(n)，空间 O(log n)。", "en": "Divide and conquer: the middle is the root and both halves recurse; the sides differ by at most one node, so the tree is balanced. O(n) time, O(log n) space."}}
