hints: [{"zh": "dp[i] 表示前 i 个字符能否被拆分。", "en": "Let dp[i] say whether the first i characters can be split."}, {"zh": "dp[i] 为真，当存在 j < i 使 dp[j] 为真且 s[j:i] 在字典中。", "en": "dp[i] is true when some j < i has dp[j] true and s[j:i] in the dictionary."}, {"zh": "把字典放进集合；只需检查长度不超过最长单词的 s[j:i]。", "en": "Put the dictionary in a set and only check s[j:i] no longer than the longest word."}]
solution: {"explanation": {"zh": "前缀 DP，时间 O(n × L)（L 为最长单词长度），空间 O(n)。", "en": "Prefix DP in O(n × L) time for longest word length L, O(n) space."}}
