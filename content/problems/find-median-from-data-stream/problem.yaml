hints: [{"zh": "每次查询都排序太慢。中位数只关心“中间”的位置。", "en": "Sorting on every query is too slow. The median only cares about the middle."}, {"zh": "把数分成较小的一半和较大的一半：较小一半用大顶堆，较大一半用小顶堆。", "en": "Split the numbers into a smaller half in a max-heap and a larger half in a min-heap."}, {"zh": "保持两个堆大小相差不超过 1，且小半边的最大值 ≤ 大半边的最小值；中位数由两个堆顶决定。", "en": "Keep their sizes within one and the smaller half's maximum ≤ the larger half's minimum; the heap tops give the median."}]
solution: {"explanation": {"zh": "双堆维护两半：addNum O(log n)，findMedian O(1)。", "en": "Two heaps keep the halves: addNum is O(log n) and findMedian O(1)."}}
