summary: {"zh": "在 n×n 棋盘上放置 n 个皇后，使它们互不攻击（不同行、不同列、不在同一斜线上）。返回所有方案，每个方案用 n 个字符串表示棋盘，'Q' 为皇后、'.' 为空位。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Place n queens on an n×n board so no two attack each other (no shared row, column, or diagonal). Return every solution as n strings with 'Q' for a queen and '.' for an empty square. (Original summary written for Learn; see LeetCode for the official statement.)"}
