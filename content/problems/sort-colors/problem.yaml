hints: [{"zh": "两遍扫描：先数出 0、1、2 的个数，再依次写回。能一遍完成吗？", "en": "Two passes: count the 0s, 1s, and 2s, then write them back. Can one pass do it?"}, {"zh": "荷兰国旗问题：维护三个区域 [0, low) 全是 0，(high, n-1] 全是 2，中间是待处理或 1。", "en": "Dutch national flag: keep [0, low) all 0, (high, n-1] all 2, and the middle unprocessed or 1."}, {"zh": "指针 i 从左向右：遇 0 与 low 交换并都前进；遇 2 与 high 交换、high 后退（i 不动）；遇 1 只前进。", "en": "Move i rightward: on 0 swap with low and advance both; on 2 swap with high and retreat high, keeping i; on 1 just advance."}]
