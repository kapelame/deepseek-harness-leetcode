hints: [{"zh": "先序遍历的第一个元素是什么？", "en": "What is the first element of the preorder traversal?"}, {"zh": "它是根。在中序遍历中找到根的位置，左边是左子树，右边是右子树，由此知道左子树的大小。", "en": "It is the root. Its position in the inorder sequence splits the left and right subtrees and tells you the left subtree's size."}, {"zh": "用哈希表记录中序中每个值的下标，递归时传下标区间，O(n) 完成。", "en": "Store each value's inorder index in a hash map and recurse on index ranges for O(n) total."}]
solution: {"explanation": {"zh": "先序首元素为根，用哈希表在中序中定位根以划分左右子树并递归。时间 O(n)，空间 O(n)。", "en": "The first preorder element is the root; a hash map locates it in the inorder sequence to split the subtrees, then recurse. O(n) time and space."}}
