hints: [{"zh": "排序后中间的元素一定是众数，但这需要 O(n log n)。", "en": "After sorting, the middle element is the majority, but that costs O(n log n)."}, {"zh": "想象让不同的数两两“抵消”：众数比其他所有数加起来还多，抵消后一定剩下它。", "en": "Imagine cancelling pairs of different values: the majority outnumbers all others combined, so it survives."}, {"zh": "Boyer–Moore 投票：维护候选和计数，计数为 0 时换候选，相同加一、不同减一。", "en": "Boyer–Moore voting: keep a candidate and a count; switch candidates at count 0, add one for a match, subtract one otherwise."}]
solution: {"explanation": {"zh": "摩尔投票，一次遍历，时间 O(n)，空间 O(1)。", "en": "Boyer–Moore voting in one pass, O(n) time, O(1) space."}}
