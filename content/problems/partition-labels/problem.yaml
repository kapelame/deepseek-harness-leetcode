summary: {"zh": "把字符串划分成尽可能多的片段，使每个字母只出现在其中一个片段里。按顺序返回各片段的长度。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Split the string into as many parts as possible so that each letter appears in only one part; return the part lengths in order. (Original summary written for Learn; see LeetCode for the official statement.)"}
