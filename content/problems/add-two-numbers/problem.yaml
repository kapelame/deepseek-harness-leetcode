summary: {"zh": "两个非负整数以逆序存放在链表中（个位在头部，每个节点一位数字）。返回它们的和，同样以逆序链表表示。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Two non-negative integers are stored in reverse order, one digit per node with the ones digit first. Return their sum as a list in the same format. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "每个链表 1 ≤ 节点数 ≤ 100，0 ≤ Node.val ≤ 9，除 0 本身外没有前导零", "en": "each list has 1 ≤ nodes ≤ 100, 0 ≤ Node.val ≤ 9, no leading zeros except the number 0"}]
