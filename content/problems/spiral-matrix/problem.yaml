summary: {"zh": "按顺时针螺旋顺序（从左上角开始，向右、向下、向左、向上循环）返回矩阵中的所有元素。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Return all elements of the matrix in clockwise spiral order, starting at the top-left and turning right, down, left, up. (Original summary written for Learn; see LeetCode for the official statement.)"}
