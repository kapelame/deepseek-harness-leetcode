summary: {"zh": "给定一个未排序的整数数组，求数值上连续的最长整数序列的长度（元素在原数组中的位置不要求相邻）。要求 O(n) 时间。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Given an unsorted integer array, return the length of the longest run of consecutive integer values; positions in the array do not matter. Aim for O(n) time. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "0 ≤ n ≤ 10⁵，-10⁹ ≤ nums[i] ≤ 10⁹", "en": "0 ≤ n ≤ 10⁵, -10⁹ ≤ nums[i] ≤ 10⁹"}]
params: [{"name": "nums", "type": "int[]"}]
returns: "int"
comparator: {"kind": "exact"}
entry: {"python": "longestConsecutive", "typescript": "longestConsecutive"}
perCaseMs: 1000
inputs: [{"type": "int[]", "minLength": 0, "smallMaxLength": 12, "largeLength": 20000, "min": -1000000000, "max": 1000000000, "smallMin": -3, "smallMax": 12}]
hints: [{"zh": "排序能做，但要 O(n log n)。不排序时，怎样快速知道 x+1 是否存在？", "en": "Sorting works but costs O(n log n). Without sorting, how can you tell quickly whether x+1 exists?"}, {"zh": "把所有数放进集合。只有 x-1 不在集合中时，x 才是一段连续序列的起点。", "en": "Put every number in a set. x starts a run only when x-1 is not in the set."}, {"zh": "对每个起点向上数 x+1, x+2, … 直到断开；每个数只会被数一次，总共 O(n)。", "en": "From each start, count x+1, x+2, … until the run breaks; every number is counted once, O(n) overall."}]
solution: {"explanation": {"zh": "用哈希集合判断存在性，只从序列起点（x-1 不存在）开始向上扩展，每个元素至多访问两次，时间 O(n)，空间 O(n)。", "en": "A hash set answers membership; extending only from run starts (x-1 absent) visits each element at most twice, O(n) time and space."}}
examples: [{"id": "ex-1", "args": [[100, 4, 200, 1, 3, 2]], "expected": 4}, {"id": "ex-2", "args": [[0, 3, 7, 2, 5, 8, 4, 6, 0, 1]], "expected": 9}, {"id": "ex-3", "args": [[1, 0, 1, 2]], "expected": 3}]
