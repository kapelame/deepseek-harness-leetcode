summary: {"zh": "两个单链表可能从某个节点开始共用后半段。返回它们相交的第一个节点；不相交则返回 null。测试输入给出链表内容和相交位置，你的函数只接收两个头节点。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Two singly linked lists may share a common tail. Return the first shared node, or null if they never meet. Test inputs describe both lists and the meeting point; your function receives only the two heads. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "1 ≤ m, n ≤ 3×10⁴，1 ≤ Node.val ≤ 10⁵；不能修改链表结构", "en": "1 ≤ m, n ≤ 3×10⁴, 1 ≤ Node.val ≤ 10⁵; do not modify the lists"}]
