summary: {"zh": "把二叉树原地展开成“链表”：按先序遍历的顺序，每个节点的左孩子为空、右孩子指向下一个节点。函数不返回值，结果按修改后的树显示。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Flatten the tree in place into a 'linked list': in preorder, every node's left child is empty and its right child is the next node. The function returns nothing; the result is shown as the modified tree. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "0 ≤ 节点数 ≤ 2000，-100 ≤ Node.val ≤ 100；进阶：O(1) 额外空间", "en": "0 ≤ nodes ≤ 2000, -100 ≤ Node.val ≤ 100; follow-up: O(1) extra space"}]
params: [{"name": "root", "type": "tree"}]
returns: "tree"
shape: {"kind": "in-place", "param": 0}
