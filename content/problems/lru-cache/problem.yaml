hints: [{"zh": "需要两种能力：按键快速查找，以及快速找到并删除最久未用的键。", "en": "You need two abilities: fast lookup by key, and fast removal of the least recently used key."}, {"zh": "哈希表负责查找；双向链表按使用时间排序，最近使用的放在一端。", "en": "A hash map handles lookup; a doubly linked list orders keys by use with the most recent at one end."}, {"zh": "get 和更新时把节点移到“最近”一端；插入新键超容量时删除“最久”一端的节点。Python 也可以用 OrderedDict.move_to_end。", "en": "On get or update move the node to the recent end; on insert over capacity remove the node at the old end. In Python, OrderedDict.move_to_end does the same."}]
solution: {"explanation": {"zh": "哈希表 + 双向链表：哈希表定位节点，链表维护使用顺序，移动与删除都是 O(1)。", "en": "Hash map plus doubly linked list: the map finds nodes and the list keeps usage order, so moves and removals are O(1)."}}
