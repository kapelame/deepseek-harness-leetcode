summary: {"zh": "判断链表中是否有环（沿 next 走会回到之前访问过的节点）。测试输入用 pos 表示尾节点连回的位置（-1 表示无环），你的函数只接收头节点。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "Report whether the list has a cycle, meaning following next revisits a node. Test inputs use pos for where the tail links back (-1 for none); your function receives only the head. (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "0 ≤ 节点数 ≤ 10⁴，-10⁵ ≤ Node.val ≤ 10⁵；进阶：O(1) 额外空间", "en": "0 ≤ nodes ≤ 10⁴, -10⁵ ≤ Node.val ≤ 10⁵; follow-up: O(1) extra space"}]
