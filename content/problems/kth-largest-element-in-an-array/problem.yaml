hints: [{"zh": "排序后取下标 n-k 是 O(n log n)。只需要前 k 大的话，要保存多少个数？", "en": "Sorting and reading index n-k costs O(n log n). If only the top k matter, how many numbers must you keep?"}, {"zh": "维护一个大小为 k 的最小堆：堆顶是当前前 k 大中最小的那个。", "en": "Keep a min-heap of size k: its top is the smallest of the current top k."}, {"zh": "新数比堆顶大就替换堆顶；最后堆顶就是答案。也可以用快速选择，平均 O(n)。", "en": "Replace the top when a new number is larger; the final top is the answer. Quickselect averages O(n) as well."}]
