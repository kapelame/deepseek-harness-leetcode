hints: [{"zh": "合并再取中间是 O(m+n)。中位数本质上是把所有数分成左右两半。", "en": "Merging costs O(m+n). The median really splits everything into a left and a right half."}, {"zh": "在较短数组上二分切分点 i，另一数组的切分点 j 由“左半部分共 (m+n+1)/2 个数”决定。", "en": "Binary search a cut i in the shorter array; the other cut j follows from the left half holding (m+n+1)/2 numbers."}, {"zh": "合法切分满足 A[i-1] ≤ B[j] 且 B[j-1] ≤ A[i]；此时中位数由两侧边界值决定。", "en": "A valid cut has A[i-1] ≤ B[j] and B[j-1] ≤ A[i]; the median then comes from the boundary values."}]
solution: {"explanation": {"zh": "在较短数组上二分切分位置，使两个数组的左半部分合起来恰好是较小的一半。时间 O(log min(m, n))。", "en": "Binary search the cut in the shorter array so that the two left parts together form the smaller half. O(log min(m, n)) time."}}
examples: [{"id": "ex-1", "args": [[1, 3], [2]], "expected": 2.0}, {"id": "ex-2", "args": [[1, 2], [3, 4]], "expected": 2.5}]
