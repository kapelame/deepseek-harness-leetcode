summary: {"zh": "对每个位置，返回数组中除它以外所有元素的乘积。不能使用除法，要求 O(n)。（本课程原创简述，完整题面见 LeetCode 官方页面。）", "en": "For each position, return the product of every other element. Do not use division; aim for O(n). (Original summary written for Learn; see LeetCode for the official statement.)"}
constraints: [{"zh": "2 ≤ n ≤ 10⁵，-30 ≤ nums[i] ≤ 30，任意前缀或后缀的乘积都在 32 位整数范围内", "en": "2 ≤ n ≤ 10⁵, -30 ≤ nums[i] ≤ 30, every prefix or suffix product fits in a 32-bit integer"}]
