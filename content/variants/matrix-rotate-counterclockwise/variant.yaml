title: {"zh": "逆时针旋转图像", "en": "Rotate an Image Counter-clockwise"}
summary: {"zh": "把 n×n 矩阵原地逆时针旋转 90 度。", "en": "Rotate an n×n matrix 90 degrees counter-clockwise in place."}
statement: {"zh": "给定 n×n 整数矩阵 `matrix`，将它**逆时针**旋转 90 度。\n\n必须原地修改 `matrix`，不能分配另一个矩阵；函数不返回值。", "en": "Given an n×n integer matrix `matrix`, rotate it 90 degrees **counter-clockwise**.\n\nModify `matrix` in place without allocating another matrix; the function returns nothing."}
difficulty: medium
skills: ["coordinate transforms", "in-place swaps"]
differences: [{"category": "output", "description": {"zh": "旋转方向相反，(i, j) 去到 (n-1-j, i)。", "en": "The direction is reversed, so (i, j) moves to (n-1-j, i)."}}, {"category": "reasoning", "description": {"zh": "需要重新推导由哪两个原地翻转组合而成。", "en": "You must re-derive which two in-place flips compose the rotation."}}]
transfer: {"zh": "“把旋转拆成两个天然原地的翻转”的方法保留；需要重新验证翻转的组合与顺序。", "en": "Splitting a rotation into two naturally in-place flips carries over; the combination and order of the flips must be re-derived."}
entry: {"python": "rotateLeft", "typescript": "rotateLeft"}
params: [{"name": "matrix", "type": "int[][]"}]
returns: "int[][]"
